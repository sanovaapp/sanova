name: Build TWA AAB (Bubblewrap)

# v2: setup-android com licenses aceitas + Bubblewrap usa SDK existente
# em vez de tentar baixar proprio (que travava por T&C nao assinado).
# Inicializa o projeto sem prompt interativo via twa-manifest.json pre-feito.

on:
  workflow_dispatch:
    inputs:
      commit_assetlinks:
        description: 'Commitar nova fingerprint no assetlinks.json automaticamente'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17 (Bubblewrap requer)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Bubblewrap doctor (diagnostico SDK)
        run: |
          set -e
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          which sdkmanager && sdkmanager --version || echo "sdkmanager NAO encontrado"
          ls -la $ANDROID_HOME/
          echo "---"
          # Aceita licenses de novo por garantia
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Bubblewrap doctor diagnostica antes do build
          npm install -g @bubblewrap/cli@latest
          bubblewrap doctor || echo "(doctor reportou problema; seguimos)"

      - name: Mostra ANDROID_HOME e licenses
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME/licenses 2>/dev/null || echo "sem dir licenses"
          which sdkmanager || true

      - name: Gera debug keystore aleatoria
        run: |
          set -e
          mkdir -p twa-build
          cd twa-build
          STORE_PWD=$(openssl rand -base64 24 | tr -d '/+=')
          KEY_PWD=$(openssl rand -base64 24 | tr -d '/+=')
          echo "STORE_PWD=$STORE_PWD" >> $GITHUB_ENV
          echo "KEY_PWD=$KEY_PWD" >> $GITHUB_ENV
          keytool -genkeypair \
            -keystore android.keystore \
            -storepass "$STORE_PWD" \
            -keypass "$KEY_PWD" \
            -alias android \
            -keyalg RSA -keysize 2048 \
            -validity 36500 \
            -dname "CN=Sanova, OU=Sanova, O=Sanova, L=BeloHorizonte, ST=MG, C=BR"
          # Extrai SHA-256 fingerprint pra cravar no assetlinks
          FP=$(keytool -list -v -keystore android.keystore -alias android -storepass "$STORE_PWD" \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' \t\r\n')
          echo "[SHA256] $FP"
          echo "SHA256_FP=$FP" >> $GITHUB_ENV

      - name: Bubblewrap init com twa-manifest pre-feito
        env:
          STORE_PWD: ${{ env.STORE_PWD }}
          KEY_PWD: ${{ env.KEY_PWD }}
        run: |
          set -e
          cd twa-build
          # twa-manifest.json com config TWA — Bubblewrap aceita esse formato
          # via --twaManifest flag, evitando prompt interativo de init.
          cat > twa-manifest.json <<EOF
          {
            "packageId": "br.app.sanova",
            "host": "sanova.app.br",
            "name": "Sanova",
            "launcherName": "Sanova",
            "display": "standalone",
            "themeColor": "#0f4f24",
            "navigationColor": "#0f4f24",
            "navigationColorDark": "#0f4f24",
            "navigationDividerColor": "#0f4f24",
            "navigationDividerColorDark": "#0f4f24",
            "backgroundColor": "#0a1f0e",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://sanova.app.br/icon-512.png",
            "maskableIconUrl": "https://sanova.app.br/icon-192.png",
            "splashScreenFadeOutDuration": 300,
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sanova.app.br/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": { "enabled": false },
              "playBilling": { "enabled": false }
            },
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://sanova.app.br/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": []
          }
          EOF
          # Cria llama.config.json apontando pro Android SDK + JDK existentes
          mkdir -p $HOME/.llama
          cat > $HOME/.llama/llama-config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          # bubblewrap usa $HOME/.bubblewrap/config.json
          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "config bubblewrap:"
          cat $HOME/.bubblewrap/config.json

      - name: Bubblewrap build (non-interactive)
        env:
          STORE_PWD: ${{ env.STORE_PWD }}
          KEY_PWD: ${{ env.KEY_PWD }}
        run: |
          set -e
          cd twa-build
          # bubblewrap build com a config previa, sem prompts.
          # --skipPwaValidation evita ping na rede que pode falhar
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias=android 2>&1 | tee build.log || (echo "build falhou"; tail -80 build.log; exit 1)

      - name: Localiza AAB gerado
        id: locate
        run: |
          set -e
          AAB_PATH=$(find twa-build -name "*.aab" -type f | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "[FAIL] AAB nao encontrado"
            find twa-build -type f \( -name "*.aab" -o -name "*.apk" \) | head -20
            exit 1
          fi
          echo "AAB encontrado: $AAB_PATH"
          cp "$AAB_PATH" sanova-twa.aab
          ls -lh sanova-twa.aab
          echo "aab_path=sanova-twa.aab" >> $GITHUB_OUTPUT

      - name: Atualiza assetlinks.json com SHA-256 real
        if: ${{ github.event.inputs.commit_assetlinks == 'true' }}
        run: |
          set -e
          cat > .well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "br.app.sanova",
                "sha256_cert_fingerprints": [
                  "${{ env.SHA256_FP }}"
                ]
              }
            }
          ]
          EOF
          cat .well-known/assetlinks.json
          git config user.name "twa-builder-bot"
          git config user.email "twa@sanova.app"
          git add .well-known/assetlinks.json
          if ! git diff --staged --quiet; then
            git commit -m "twa: assetlinks.json com SHA-256 da debug keystore deste build"
            git push
          else
            echo "Sem mudanca no assetlinks (fingerprint igual)"
          fi

      - name: Upload AAB como artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanova-twa-aab
          path: sanova-twa.aab
          retention-days: 30

      - name: Resumo
        if: always()
        run: |
          {
            echo "## TWA AAB build"
            echo ""
            echo "**Package**: br.app.sanova"
            echo "**SHA-256 fingerprint (debug keystore)**: \`${{ env.SHA256_FP }}\`"
            echo ""
            echo "**Download do AAB**: aba 'Artifacts' acima → \`sanova-twa-aab\` → \`sanova-twa.aab\`"
            echo ""
            echo "**Próximo passo Bruno**: upload do AAB no Play Console → app br.app.sanova → Releases → Internal testing → Create new release → drag & drop do .aab."
            echo ""
            echo "ATENÇÃO: Play App Signing vai REASSINAR o AAB com a key do Google."
            echo "A SHA-256 REAL final aparece no painel do Play Console (App signing key certificate)."
            echo "Quando Bruno colar essa SHA-256 REAL no canal, re-cravo no assetlinks.json."
          } >> $GITHUB_STEP_SUMMARY
