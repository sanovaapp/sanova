name: Publish TWA to Google Play

# T54 (Fable) — pipeline hands-off: build AAB + upload na track escolhida.
# Bruno decidiu (T56) que a service account será criada NA CONTA ORG MEDFAST
# (a pessoal foi rejeitada por politica Play — apps de saude exigem entidade).
# Enquanto a org nao existe, esse workflow fica dormante — o secret
# PLAY_SERVICE_ACCOUNT_JSON so aparece depois da transferencia do br.app.sanova
# pra conta org.
#
# Dependencias humanas (uma vez, na conta ORG):
#   1. Secret PLAY_SERVICE_ACCOUNT_JSON — Play Console → Config → Acesso API
#      → criar SA no Cloud + conceder acesso ao app br.app.sanova com
#      permissao "Release" (Admin + Editor OK tambem).
#   2. Secret TWA_UPLOAD_KEYSTORE_B64 — base64 da keystore fixa (upload key).
#      Cravada uma unica vez pra que a SHA-256 nao mude a cada build.
#      (`openssl base64 -in android.keystore -out ks.b64 -A`)
#   3. Secrets TWA_UPLOAD_STORE_PWD + TWA_UPLOAD_KEY_PWD — senhas da keystore.
#
# Enquanto (2) e (3) nao existirem, o workflow gera keystore aleatoria e
# faz build no artifact (mas o upload pra Play falha com "Package not found"
# porque a SHA nao bate com a upload key registrada no Play). O erro eh
# esperado — sinal pra criar a keystore permanente.
#
# Trigger:
#   - workflow_dispatch (manual, escolhe track)
#   - push tag v* (auto — pra futuros releases)

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Console track de publicacao'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - closed
          - production
      release_status:
        description: 'Status do release'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - completed
          - inProgress
          - halted
      version_code:
        description: 'appVersionCode (integer, incrementa a cada build)'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Nome do release (default: SANOVA_VERSION do index.html)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-play
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Build + Upload to Google Play
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK + accept licenses
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0 cmdline-tools;latest'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Detecta SANOVA_VERSION e appVersionCode
        id: meta
        run: |
          set -e
          # Extrai SANOVA_VERSION do index.html (ex: 3.10.52)
          SANOVA_VERSION=$(grep -oP "var SANOVA_VERSION\s*=\s*'\K[^']+" index.html || echo "0.0.0")
          echo "SANOVA_VERSION=$SANOVA_VERSION" >> $GITHUB_ENV
          echo "sanova_version=$SANOVA_VERSION" >> $GITHUB_OUTPUT

          # appVersionCode: se dispatch passou explicito usa; senao gera a partir de github.run_number
          MANUAL_VC="${{ github.event.inputs.version_code }}"
          if [ -n "$MANUAL_VC" ]; then
            VC="$MANUAL_VC"
          else
            # base 100 pra sobrar espaco pro run_number crescer sem colidir
            VC=$(( 100 + ${{ github.run_number }} ))
          fi
          echo "APP_VERSION_CODE=$VC" >> $GITHUB_ENV
          echo "app_version_code=$VC" >> $GITHUB_OUTPUT
          echo "[meta] SANOVA_VERSION=$SANOVA_VERSION APP_VERSION_CODE=$VC"

      - name: Restaura keystore de upload (fixa) ou gera aleatoria
        id: keystore
        run: |
          set -e
          mkdir -p twa-build
          cd twa-build

          if [ -n "${{ secrets.TWA_UPLOAD_KEYSTORE_B64 }}" ]; then
            echo "[keystore] restaurando upload key permanente do secret"
            echo "${{ secrets.TWA_UPLOAD_KEYSTORE_B64 }}" | base64 -d > android.keystore
            STORE_PWD="${{ secrets.TWA_UPLOAD_STORE_PWD }}"
            KEY_PWD="${{ secrets.TWA_UPLOAD_KEY_PWD }}"
            # A keystore de junho veio do PWABuilder, e o alias dela e
            # `my-key-alias` — nao `android`, que era o chute do workflow. Com o
            # alias errado o keytool nao acha a chave e a assinatura falha.
            KEY_ALIAS="my-key-alias"
            echo "USING_FIXED_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "[keystore] AVISO: secret TWA_UPLOAD_KEYSTORE_B64 ausente."
            echo "[keystore] Gerando keystore aleatoria — o Play REJEITARA o upload"
            echo "[keystore] porque a SHA-256 nao bate com o upload key registrado."
            echo "[keystore] Bruno precisa criar uma keystore fixa e cravar como secret."
            STORE_PWD=$(openssl rand -base64 24 | tr -d '/+=')
            KEY_PWD=$(openssl rand -base64 24 | tr -d '/+=')
            KEY_ALIAS="android"
            keytool -genkeypair \
              -keystore android.keystore \
              -storepass "$STORE_PWD" -keypass "$KEY_PWD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 36500 \
              -dname "CN=Sanova, OU=Sanova, O=MEDFAST, L=BeloHorizonte, ST=MG, C=BR"
            echo "USING_FIXED_KEYSTORE=false" >> $GITHUB_ENV
          fi

          echo "STORE_PWD=$STORE_PWD" >> $GITHUB_ENV
          echo "KEY_PWD=$KEY_PWD" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV

          # Se o alias estiver errado o keytool devolve vazio aqui. Antes isso
          # passava batido e o erro so aparecia la na frente, disfarcado.
          FP=$(keytool -list -v -keystore android.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PWD" \
            | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ' \t\r\n')
          if [ -z "$FP" ]; then
            echo "::error::nao consegui ler a SHA-256 da keystore com o alias '$KEY_ALIAS'"
            exit 1
          fi
          echo "[keystore] SHA-256 desta build: $FP"
          echo "SHA256_FP=$FP" >> $GITHUB_ENV

      - name: Bubblewrap update + build
        env:
          STORE_PWD: ${{ env.STORE_PWD }}
          KEY_PWD: ${{ env.KEY_PWD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          SANOVA_VERSION: ${{ env.SANOVA_VERSION }}
          # O Bubblewrap le as senhas destas variaveis quando roda sem
          # terminal interativo. Sem elas ele PERGUNTA, e num runner ninguem
          # responde — o build morre esperando entrada.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.STORE_PWD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PWD }}
        run: |
          # pipefail e o conserto do bug que fez esta etapa mentir: com
          # `cmd | tee log`, o `set -e` olha o codigo do TEE, nao do cmd. O
          # bubblewrap falhava, o tee dava certo, e a etapa ficava verde em 12
          # segundos sem gerar AAB nenhum. O erro so aparecia na etapa seguinte,
          # como "arquivo nao encontrado" — sintoma longe da causa.
          set -eo pipefail
          cd twa-build

          npm install -g @bubblewrap/cli@latest

          cat > twa-manifest.json <<EOF
          {
            "packageId": "br.app.sanova",
            "host": "sanova.app.br",
            "name": "Sanova",
            "launcherName": "Sanova",
            "display": "standalone",
            "themeColor": "#0f4f24",
            "navigationColor": "#0f4f24",
            "navigationColorDark": "#0f4f24",
            "navigationDividerColor": "#0f4f24",
            "navigationDividerColorDark": "#0f4f24",
            "backgroundColor": "#0a1f0e",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://sanova.app.br/icon-512.png",
            "maskableIconUrl": "https://sanova.app.br/icon-192.png",
            "splashScreenFadeOutDuration": 300,
            "appVersionName": "${SANOVA_VERSION}",
            "appVersionCode": ${APP_VERSION_CODE},
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sanova.app.br/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": { "enabled": false },
              "playBilling": { "enabled": false }
            },
            "signingKey": {
              "path": "./android.keystore",
              "alias": "${KEY_ALIAS}"
            },
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://sanova.app.br/",
            "_comentario_minSdk": "21 = Android 5.0. Era 19 (Android 4.4) e o build MORRIA no merge de manifesto: a androidbrowserhelper 2.6.2, que e a biblioteca que faz o TWA funcionar, exige 21. Nao ha escolha aqui — 19 nao compila. Custo pratico: zero. Android 5.0 saiu em 2014 e cobre mais de 99% dos aparelhos em uso.",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": []
          }
          EOF

          mkdir -p $HOME/.bubblewrap
          cat > $HOME/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          # `update` gera o projeto Android a partir do twa-manifest.json. Ele
          # FALTAVA — o workflow escrevia o manifesto e chamava `build` direto,
          # sem projeto nenhum pra construir. Por isso o build "terminava" em
          # segundos sem produzir AAB. A etapa se chamava "init + build" e nao
          # rodava nem um nem outro.
          echo "[bubblewrap] gerando o projeto Android a partir do manifesto"
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json 2>&1 | tee update.log

          echo "[bubblewrap] construindo o AAB"
          bubblewrap build \
            --skipPwaValidation \
            --manifest=./twa-manifest.json \
            --signingKeyPath=./android.keystore \
            --signingKeyAlias="$KEY_ALIAS" 2>&1 | tee build.log

      - name: Localiza AAB gerado
        id: locate
        run: |
          set -e
          AAB_PATH=$(find twa-build -name "*.aab" -type f | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "[FAIL] AAB nao encontrado"
            find twa-build -type f -name "*.aab" -o -name "*.apk" | head -20
            exit 1
          fi
          cp "$AAB_PATH" sanova-twa.aab
          ls -lh sanova-twa.aab
          echo "aab_path=sanova-twa.aab" >> $GITHUB_OUTPUT

      - name: Upload AAB como artifact (fallback pra download manual)
        uses: actions/upload-artifact@v4
        with:
          name: sanova-twa-aab-v${{ env.SANOVA_VERSION }}-${{ env.APP_VERSION_CODE }}
          path: sanova-twa.aab
          retention-days: 30

      - name: Determina track (input do dispatch OU default pra push tag)
        id: track
        run: |
          set -e
          TRACK="${{ github.event.inputs.track }}"
          STATUS="${{ github.event.inputs.release_status }}"
          if [ -z "$TRACK" ]; then
            # dispatch por tag v* → default track = internal, status = draft
            TRACK="internal"
            STATUS="draft"
          fi
          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Nome do release
        id: relname
        run: |
          set -e
          NAME="${{ github.event.inputs.release_name }}"
          if [ -z "$NAME" ]; then
            NAME="v${SANOVA_VERSION} (${APP_VERSION_CODE})"
          fi
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Confere secret PLAY_SERVICE_ACCOUNT_JSON antes de tentar upload
        id: guard
        run: |
          set -e
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON ausente — publish bloqueado. AAB ficou disponivel como artifact."
            echo "publish_ok=false" >> $GITHUB_OUTPUT
          else
            echo "publish_ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Diagnostico de acesso a Play API (traduz o 403)
        if: steps.guard.outputs.publish_ok == 'true'
        env:
          SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eo pipefail
          # O erro que derrubou a rodada 4 chegou como PAGINA HTML do Google:
          #   "Your client does not have permission to get URL /.../edits"
          # HTML nao diz qual das causas e. Esta etapa chama a API na mao,
          # imprime o corpo cru e traduz. Nunca imprime a chave — so o e-mail
          # da service account, que e publico por natureza.
          printf '%s' "$SA_JSON" > sa.json
          SA_EMAIL=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("sa.json","utf8")).client_email||"?")')
          SA_PROJ=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("sa.json","utf8")).project_id||"?")')
          echo "[diag] service account: $SA_EMAIL"
          echo "[diag] projeto Cloud:   $SA_PROJ"

          # Token OAuth a partir da chave da service account.
          TOKEN=$(GOOGLE_APPLICATION_CREDENTIALS=sa.json node -e '
            const {execSync}=require("child_process");
            const c=JSON.parse(require("fs").readFileSync("sa.json","utf8"));
            const crypto=require("crypto");
            const b=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            const now=Math.floor(Date.now()/1000);
            const head=b({alg:"RS256",typ:"JWT"});
            const body=b({iss:c.client_email,scope:"https://www.googleapis.com/auth/androidpublisher",
                          aud:"https://oauth2.googleapis.com/token",iat:now,exp:now+3600});
            const sig=crypto.createSign("RSA-SHA256").update(head+"."+body).sign(c.private_key).toString("base64url");
            const jwt=head+"."+body+"."+sig;
            fetch("https://oauth2.googleapis.com/token",{method:"POST",
              headers:{"content-type":"application/x-www-form-urlencoded"},
              body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion:jwt})})
              .then(r=>r.json()).then(j=>{ if(!j.access_token){console.error(JSON.stringify(j));process.exit(1);}
                                          process.stdout.write(j.access_token); });
          ')
          echo "[diag] token OAuth obtido — a CHAVE esta valida"

          CODE=$(curl -s -o resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Length: 0" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/br.app.sanova/edits")
          echo "[diag] HTTP $CODE"
          echo "--- resposta crua ---"; head -c 2000 resp.txt; echo; echo "---------------------"

          if [ "$CODE" = "200" ]; then
            echo "[diag] OK — a service account enxerga br.app.sanova. Upload deve passar."
            exit 0
          fi

          # Traducao das tres causas que produzem 403 aqui.
          if grep -qi 'SERVICE_DISABLED\|has not been used in project\|accessNotConfigured' resp.txt; then
            echo "::error::A Google Play Android Developer API esta DESLIGADA no projeto $SA_PROJ. Ligar em: https://console.cloud.google.com/apis/library/androidpublisher.googleapis.com?project=$SA_PROJ"
          elif grep -qi 'insufficient permissions\|does not have permission\|permissionDenied' resp.txt; then
            echo "::error::A chave e valida mas $SA_EMAIL nao tem permissao no app br.app.sanova. Conferir em Play Console -> Usuarios e permissoes -> $SA_EMAIL -> aba Apps -> br.app.sanova com 'Gerenciar versoes'. Mudanca de permissao pode levar ate 24h pra valer na API."
          elif grep -qi 'applicationNotFound\|Package not found' resp.txt; then
            echo "::error::A conta enxergada por $SA_EMAIL nao contem o app br.app.sanova. Isso acontece quando a service account foi convidada numa conta de desenvolvedor diferente da que hoje e dona do app."
          else
            echo "::error::403/erro nao catalogado — corpo cru acima."
          fi
          exit 1

      - name: Upload no Google Play (r0adkll/upload-google-play)
        if: steps.guard.outputs.publish_ok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.app.sanova
          releaseFiles: sanova-twa.aab
          track: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.status }}
          releaseName: ${{ steps.relname.outputs.name }}
          # whatsNewDirectory: distribution/whatsnew  # (opcional — se um dia
          # a gente escrever changelog por track, aponta aqui)

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Publish TWA → Google Play"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| Package | \`br.app.sanova\` |"
            echo "| SANOVA_VERSION | \`${SANOVA_VERSION}\` |"
            echo "| appVersionCode | \`${APP_VERSION_CODE}\` |"
            echo "| Track | \`${{ steps.track.outputs.track }}\` |"
            echo "| Status | \`${{ steps.track.outputs.status }}\` |"
            echo "| Release name | \`${{ steps.relname.outputs.name }}\` |"
            echo "| Keystore fixa | \`${USING_FIXED_KEYSTORE}\` |"
            echo "| SHA-256 desta build | \`${SHA256_FP}\` |"
            echo "| Upload feito? | \`${{ steps.guard.outputs.publish_ok }}\` |"
            echo ""
            if [ "${{ steps.guard.outputs.publish_ok }}" != "true" ]; then
              echo "> **Publish bloqueado — falta \`PLAY_SERVICE_ACCOUNT_JSON\`.** AAB baixavel"
              echo "> como artifact acima. Ver header do arquivo pro passo-a-passo."
            fi
            if [ "${USING_FIXED_KEYSTORE}" != "true" ]; then
              echo ""
              echo "> **Keystore aleatoria em uso.** O Play REJEITA upload porque a SHA-256"
              echo "> nao bate com a upload key registrada. Cravar secrets:"
              echo "> - \`TWA_UPLOAD_KEYSTORE_B64\` (base64 -A da keystore permanente)"
              echo "> - \`TWA_UPLOAD_STORE_PWD\`"
              echo "> - \`TWA_UPLOAD_KEY_PWD\`"
            fi
          } >> $GITHUB_STEP_SUMMARY
