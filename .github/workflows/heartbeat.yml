name: Heartbeat Diario Sala Sanova

# T64 (Carta de Autonomia): pulso diario da empresa na Sala #148.
# Toda a logica vive em .github/scripts/heartbeat.mjs — a 1a versao
# montava markdown com heredoc dentro de `run: |` e quebrava o parse do
# YAML (12 runs falhados sem nunca executar). Script separado resolve.
#
# Testar local:  DRY_RUN=1 node .github/scripts/heartbeat.mjs
#
# Cron: 11:00 UTC = 08:00 BRT.

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: heartbeat-sala
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publica o pulso na Sala
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/heartbeat.mjs
