name: MP Sandbox helper

# Workflow gateway pra acionar endpoints do Worker que o sandbox do Claude Code
# nao consegue chamar (workers.dev bloqueado por host_not_allowed).
#
# Disparado manualmente via workflow_dispatch. Cada action corresponde a um
# endpoint helper do Worker. O resultado vai parar no log do run.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acao a executar'
        required: true
        default: 'mp-create-test-user'
        type: choice
        options:
          - mp-create-test-user
          - debug-admin
          - debug-gemini
          - health
          - admin-simulate-active
          - admin-revert-trial
          - admin-magic-link-bruno
          - admin-set-email-templates
          - admin-set-auth-urls
          - admin-ensure-mp-plans
          - admin-recreate-mp-plans
          - admin-recent-subscriptions
          - admin-reconcile-subscriptions
          - admin-debug-mp-state
          - admin-reconcile-via-preapproval-id
          - admin-list-recent-payments
          - admin-debug-cogo-payment
          - admin-reconcile-via-payments
          - admin-debug-cogo-real
          - admin-reconcile-final
          - admin-cleanup-false-positives
          - admin-cleanup-v2
          - admin-check-payment-methods
          - admin-fixture-bootstrap
          - admin-fixture-bootstrap-incompleta
          - admin-seed-fixture-completa
          - admin-seed-demo
          - admin-debug-pro-state
          - admin-grant-pro
      email:
        description: 'Email alvo (usado por admin-simulate-active, admin-revert-trial, admin-grant-pro).'
        required: false
        default: ''
        type: string

jobs:
  call-worker:
    runs-on: ubuntu-latest
    name: Chama Worker e exibe resposta
    steps:
      - name: Curl Worker endpoint
        id: curl
        env:
          ADMIN_OVERRIDE_TOKEN: ${{ secrets.ADMIN_OVERRIDE_TOKEN }}
        run: |
          set -e
          BASE="https://sanova-api.contatosanovaapp.workers.dev"
          ACTION="${{ github.event.inputs.action }}"
          EMAIL="${{ github.event.inputs.email }}"
          # v1.28.3: 'admin-fixture-bootstrap-incompleta' eh atalho pra
          # '/api/admin-fixture-bootstrap?modo=incompleta'.
          if [ "$ACTION" = "admin-fixture-bootstrap-incompleta" ]; then
            URL="$BASE/api/admin-fixture-bootstrap?modo=incompleta"
          elif [ -n "$EMAIL" ] && { [ "$ACTION" = "admin-simulate-active" ] || [ "$ACTION" = "admin-revert-trial" ] || [ "$ACTION" = "admin-grant-pro" ]; }; then
            # v1.28.11: email via query param. v1.28.14: cobre admin-grant-pro.
            ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$EMAIL")
            URL="$BASE/api/$ACTION?email=$ENCODED"
          else
            URL="$BASE/api/$ACTION"
          fi
          echo "## Chamando $URL" | tee -a $GITHUB_STEP_SUMMARY
          # v1.24.0: header X-Admin-Token autentica /api/admin-* (no-op pra
          # rotas publicas como health/debug). GitHub mascara o secret.
          RESPONSE=$(curl -sS -w "\n---HTTP_STATUS:%{http_code}---\n" \
            -H "X-Admin-Token: $ADMIN_OVERRIDE_TOKEN" \
            "$URL")
          echo "$RESPONSE"
          # Tambem grava no Summary (acessivel via API) e como output
          {
            echo "## Resposta do Worker"
            echo ''
            echo '```json'
            echo "$RESPONSE"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
