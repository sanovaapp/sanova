name: Prints — pacote visual

# Captura as telas principais do app em 412x915 e empacota num zip.
# Canal visual permanente Bruno → Fable (auditoria de UX).
#
# v2 (Fable):
#   · Seed via Worker (/api/admin-seed-fixture-completa) — 7d daily com
#     refeicoes com proteina + 7 pesagens + aplicacao recente. Sem race.
#   · 11 telas (vs 7 v1). Inclui Analise dos pilares, Balanco expandido,
#     Metabolismo expandido.
#   · Expande todos os <details> antes de cada snap.
#   · Captura TODOS pageerrors com stack trace (caca o innerHTML null).

on:
  workflow_dispatch: {}

# v3 (Fable):
#   · SANOVA_ORIGIN como env do job (prepara migracao de dominio futuro).
#   · Conta fixture@sanova.app dedicada (admin-fixture-bootstrap).
#     Nao mexe na subscription real do fundador.
env:
  SANOVA_ORIGIN: https://sanovaapp.github.io/sanova
  WORKER_BASE: https://sanova-api.contatosanovaapp.workers.dev

jobs:
  prints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # v3.1 (Fable): permissions:contents:write pra publicar zip como
    # asset de release publico (URL estavel, sem login).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm install -D @playwright/test@1.49.0
          npx playwright install --with-deps chromium

      - name: Bootstrap fixture (cria user + seed + active + magic link)
        id: link
        env:
          ADMIN_OVERRIDE_TOKEN: ${{ secrets.ADMIN_OVERRIDE_TOKEN }}
        run: |
          set -e
          echo "== fixture bootstrap =="
          RAW=$(curl -sS -H "X-Admin-Token: $ADMIN_OVERRIDE_TOKEN" "$WORKER_BASE/api/admin-fixture-bootstrap")
          echo "$RAW" | head -c 1200
          echo
          LINK=$(echo "$RAW" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('action_link',''))")
          if [ -z "$LINK" ]; then
            echo "Erro: magic link nao retornado"; echo "$RAW"; exit 1
          fi
          echo "magic_link=$LINK" >> $GITHUB_OUTPUT

      - name: Captura das 11 telas
        env:
          MAGIC_LINK: ${{ steps.link.outputs.magic_link }}
          SANOVA_ORIGIN: ${{ env.SANOVA_ORIGIN }}
        run: |
          mkdir -p prints
          cat > prints.mjs <<'PWEND'
          import { chromium } from '@playwright/test';

          const MAGIC = process.env.MAGIC_LINK;
          const ORIGIN = process.env.SANOVA_ORIGIN || 'https://sanovaapp.github.io/sanova';
          if (!MAGIC) { console.error('MAGIC_LINK vazio'); process.exit(1); }

          const browser = await chromium.launch();
          const ctx = await browser.newContext({
            viewport: { width: 412, height: 915 },
            deviceScaleFactor: 2,
            userAgent: 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36',
            locale: 'pt-BR',
          });
          const page = await ctx.newPage();

          // Captura TODOS pageerrors com stack trace pra Fable analisar.
          const erros = [];
          page.on('pageerror', e => {
            const entry = { msg: e.message, stack: (e.stack || '').slice(0, 800), when: new Date().toISOString() };
            erros.push(entry);
            console.log('[pageerror]', entry.msg);
          });
          page.on('console', m => {
            if (m.type() === 'error') {
              console.log('[console.error]', m.text().slice(0, 300));
            }
          });

          let N = 1;
          async function snap(name) {
            // Expande TUDO antes do snap (Fable v3): nativos <details> +
            // collapsibles custom do Sanova (botoes com onclick que tem
            // display:none nas secoes: "Entenda...", "Como calculei...", etc).
            await page.evaluate(() => {
              try {
                document.querySelectorAll('details').forEach(d => d.open = true);
                document.querySelectorAll('[aria-expanded="false"]').forEach(el => {
                  try { el.click(); } catch (e) {}
                });
                const textosToggle = [
                  /^▸/, /^▾/, /^▼/, /^▶/,
                  /entenda/i, /como calculei/i, /saiba mais/i,
                  /detalhes/i, /análise clínica/i,
                ];
                const candidatos = Array.from(document.querySelectorAll('button, summary, [onclick], [role="button"]'));
                for (const el of candidatos) {
                  const t = (el.textContent || '').trim().slice(0, 80);
                  if (!t || !textosToggle.some(rx => rx.test(t))) continue;
                  const next = el.nextElementSibling;
                  const pn = el.parentElement && el.parentElement.nextElementSibling;
                  const target = (next && getComputedStyle(next).display === 'none') ? next
                                : (pn && getComputedStyle(pn).display === 'none') ? pn : null;
                  if (target) { try { el.click(); } catch (e) {} }
                }
              } catch (e) {}
            });
            await page.waitForTimeout(500);
            const path = `prints/${String(N++).padStart(2,'0')}-${name}.png`;
            await page.screenshot({ path, fullPage: true });
            console.log('Snap:', path);
          }
          // Helper resiliente: cada cena em try/catch, fecha drawer e rola pro topo.
          async function cena(name, fn) {
            try {
              await page.evaluate(() => {
                try { if (typeof fecharMais === 'function') fecharMais(); } catch(e){}
                window.scrollTo(0, 0);
              });
              await page.waitForTimeout(300);
              await fn();
            } catch (e) {
              console.log(`[skip ${name}]`, e.message);
            }
          }
          // Click programatico (bypassa visibility check do Playwright).
          // Tab bar fica em position:fixed bottom — scrollIntoViewIfNeeded
          // confunde e falha em fullPage. Click via evaluate ignora visibility.
          async function clickTab(sel) {
            const ok = await page.evaluate((s) => {
              const el = document.querySelector(s);
              if (!el) return false;
              el.click();
              return true;
            }, sel);
            if (!ok) throw new Error('selector nao encontrado: ' + sel);
          }

          // ─── 1. ONBOARDING (estado limpo, sem login) ──────────────
          console.log('1/11 onboarding');
          await page.goto(ORIGIN + '/', { waitUntil: 'load', timeout: 45000 });
          await page.waitForTimeout(3000);
          await snap('onboarding');

          // ─── Login via magic link (sync puxa fixture do Supabase) ─
          console.log('Login...');
          await page.goto(MAGIC, { waitUntil: 'load', timeout: 45000 });
          await page.waitForTimeout(3500);
          const initialUrl = page.url();
          if (!initialUrl.includes('/sanova/')) {
            const hash = await page.evaluate(() => location.hash);
            await page.goto(ORIGIN + '/' + (hash || ''), { waitUntil: 'load', timeout: 45000 });
            await page.waitForTimeout(8000);  // sync busca app_state
          }
          // Aguarda sessao Supabase consolidar.
          await page.waitForTimeout(5000);

          // v3.2.2 Fable — DIAGNOSTICO ANTES do force-sync:
          const diagAntes = await page.evaluate(async () => {
            try {
              const raw = localStorage.getItem('equilibra_v5') || '';
              const S = raw ? JSON.parse(raw) : null;
              let user = null;
              try {
                if (window.sb && window.sb.auth) {
                  const r = await window.sb.auth.getUser();
                  user = r && r.data && r.data.user
                    ? { id: r.data.user.id.slice(0,8) + '...', email: r.data.user.email }
                    : null;
                }
              } catch (e) {}
              return {
                bytes: raw.length,
                daily_dias: (S && Array.isArray(S.daily)) ? S.daily.length : 0,
                weights_count: (S && Array.isArray(S.weights)) ? S.weights.length : 0,
                profile_name: (S && S.profile && S.profile.name) || null,
                ativo: localStorage.getItem('sanova_ativo'),
                sb_existe: !!window.sb,
                sb_user: user,
              };
            } catch (e) { return { erro: e.message }; }
          });
          console.log('=== ANTES do force-sync ===');
          console.log(JSON.stringify(diagAntes, null, 2));

          // v3.2.2 Fable — FORCE SYNC: busca app_state direto via sb.from
          // e escreve em localStorage. Bypassa aoLogar que nao roda em
          // tempo habil apos magic link.
          const forced = await page.evaluate(async () => {
            try {
              if (!window.sb || !window.sb.auth) return { ok: false, motivo: 'sb_nao_existe' };
              const userResp = await window.sb.auth.getUser();
              const user = userResp && userResp.data && userResp.data.user;
              if (!user) return { ok: false, motivo: 'sem_sessao' };
              const r = await window.sb.from('app_state').select('state').eq('user_id', user.id).maybeSingle();
              if (!r.data || !r.data.state) {
                return { ok: false, motivo: 'app_state_vazio', user_id_curto: user.id.slice(0,8) + '...' };
              }
              const state = r.data.state;
              localStorage.setItem('equilibra_v5', JSON.stringify(state));
              localStorage.setItem('sanova_ativo', '1');
              localStorage.setItem('sanova_termo_aceito', JSON.stringify({
                versao: 'v1', aceitoEm: new Date().toISOString(),
              }));
              return {
                ok: true,
                user_id_curto: user.id.slice(0,8) + '...',
                bytes: JSON.stringify(state).length,
                daily_dias: Array.isArray(state.daily) ? state.daily.length : 0,
                weights_count: Array.isArray(state.weights) ? state.weights.length : 0,
                profile_name: state.profile && state.profile.name,
                fixture_marker: state._meta && state._meta.fixture,
              };
            } catch (e) { return { ok: false, motivo: 'exception', msg: e.message }; }
          });
          console.log('=== FORCE-SYNC ===');
          console.log(JSON.stringify(forced, null, 2));
          if (!forced.ok) {
            console.error('[ABORT] force-sync falhou:', forced.motivo);
            await browser.close();
            process.exit(1);
          }

          // Recarrega UI sem perder o localStorage (que acabamos de escrever).
          await page.evaluate(() => {
            try {
              if (typeof esconderGate === 'function') esconderGate();
              if (typeof carregar === 'function') carregar();
              if (typeof bootApp === 'function') bootApp();
              if (typeof go === 'function') go('home');
              if (typeof render === 'function') render();
            } catch (e) { console.log('boot err:', e.message); }
          });
          await page.waitForTimeout(3500);

          // v3.1 Fable — DIAGNOSTICO DEPOIS do gate forcado:
          const diag = await page.evaluate(() => {
            try {
              const raw = localStorage.getItem('equilibra_v5') || '';
              const S = raw ? JSON.parse(raw) : null;
              return {
                LS_equilibra_v5_bytes: raw.length,
                LS_sanova_ativo: localStorage.getItem('sanova_ativo'),
                sanova_version: window.SANOVA_VERSION || null,
                rota_ativa: (typeof window._viewAtual !== 'undefined' ? window._viewAtual : null)
                          || document.body.dataset.view
                          || (document.querySelector('#dashboard:not(.hidden)') ? 'dashboard' : null)
                          || 'desconhecida',
                profile_completo: !!(S && S.profile && S.profile.name && S.profile.weightKg),
                daily_dias: (S && Array.isArray(S.daily)) ? S.daily.length : 0,
                weights_count: (S && Array.isArray(S.weights)) ? S.weights.length : 0,
                _meta_fixture: S && S._meta && S._meta.fixture,
              };
            } catch (e) { return { erro: e.message }; }
          });
          console.log('=== DIAGNOSTICO POS-LOGIN ===');
          console.log(JSON.stringify(diag, null, 2));

          // v3.1 Fable — ASSERT: painel logado renderizou.
          // Se nao tem nenhum dos elementos-chave, abortar com exit 1.
          const painelOk = await page.evaluate(() => {
            return !!(
              document.querySelector('#heroPesoAtual') ||
              document.querySelector('#painelHojeBar') ||
              document.querySelector('#pilarProtMuscMini') ||
              document.querySelector('#calBarCard')
            );
          });
          if (!painelOk) {
            console.error('[ABORT] Painel logado nao renderizou — anamnese pode ter sido exibida');
            console.error('Diagnostico:', JSON.stringify(diag, null, 2));
            await browser.close();
            process.exit(1);
          }
          console.log('[ok] painel logado renderizado');

          // ─── 2. PAINEL — topo (sem rolar) ─────────────────────────
          console.log('2/11 painel-topo');
          await page.evaluate(() => window.scrollTo(0, 0));
          await page.waitForTimeout(500);
          await snap('painel-topo');

          // ─── 3. PAINEL — fullPage com Analise dos pilares ────────
          console.log('3/11 painel-completo');
          // Garante que a tab Painel esta ativa
          await page.evaluate(() => { if (typeof go === 'function') go('home'); });
          await page.waitForTimeout(1200);
          await snap('painel-completo');

          // ─── 4. BALANCO ENERGETICO — semana expandido ─────────────
          await cena('4/11 balanco-semana', async () => {
            console.log('4/11 balanco-semana');
            await page.evaluate(() => {
              try {
                if (typeof setPilaresPeriodo === 'function') setPilaresPeriodo('semana');
                document.querySelectorAll('details').forEach(d => d.open = true);
              } catch (e) {}
            });
            await page.waitForTimeout(1200);
            await page.evaluate(() => {
              const titulos = Array.from(document.querySelectorAll('div,h2,h3'));
              const t = titulos.find(el => /balan[çc]o energ/i.test(el.textContent || ''));
              if (t) t.scrollIntoView({behavior:'instant', block:'start'});
            });
            await page.waitForTimeout(800);
            await snap('balanco-semana-expandido');
          });

          // ─── 5. MEDICACAO ─────────────────────────────────────────
          await cena('5/11 medicacao', async () => {
            console.log('5/11 medicacao');
            await clickTab('#nb-caneta');
            await page.waitForTimeout(1500);
            await snap('medicacao');
          });

          // ─── 6. CHECK-IN ──────────────────────────────────────────
          await cena('6/11 checkin', async () => {
            console.log('6/11 checkin');
            await clickTab('#nb-checkin');
            await page.waitForTimeout(1500);
            await snap('checkin');
          });

          // ─── 7. SAUDE (sintomas / janela) ────────────────────────
          await cena('7/11 saude', async () => {
            console.log('7/11 saude');
            await clickTab('#nb-saude');
            await page.waitForTimeout(1500);
            await snap('saude');
          });

          // ─── 8. MINHA JORNADA ─────────────────────────────────────
          await cena('8/11 jornada', async () => {
            console.log('8/11 jornada');
            await page.evaluate(() => { if (typeof go === 'function') go('jornada'); });
            await page.waitForTimeout(2000);
            await snap('jornada');
          });

          // ─── 9. METABOLISMO E METAS — expandido ──────────────────
          await cena('9/11 metabolismo', async () => {
            console.log('9/11 metabolismo');
            await page.evaluate(() => { if (typeof go === 'function') go('perfil'); });
            await page.waitForTimeout(1500);
            await page.evaluate(() => {
              const titulos = Array.from(document.querySelectorAll('div,h2,h3'));
              const t = titulos.find(el => /metabolismo|metas/i.test(el.textContent || '') && el.textContent.length < 200);
              if (t) t.scrollIntoView({behavior:'instant', block:'start'});
            });
            await page.waitForTimeout(800);
            await snap('metabolismo-metas');
          });

          // ─── 10. PERFIL (rola pro fim) ───────────────────────────
          await cena('10/11 perfil-fim', async () => {
            console.log('10/11 perfil-fim');
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
            await page.waitForTimeout(800);
            await snap('perfil-fim');
          });

          // ─── 11. MAIS (drawer aberto) ────────────────────────────
          await cena('11/11 mais', async () => {
            console.log('11/11 mais');
            await page.evaluate(() => { if (typeof go === 'function') go('home'); });
            await page.waitForTimeout(1500);
            await page.evaluate(() => { if (typeof abrirMais === 'function') abrirMais(); });
            await page.waitForTimeout(1000);
            await snap('mais-drawer');
          });

          // Salva erros pra artifact
          if (erros.length) {
            const { writeFileSync } = await import('fs');
            writeFileSync('prints/_pageerrors.json', JSON.stringify(erros, null, 2));
            console.log(`[!] ${erros.length} pageerror(s) capturado(s) em prints/_pageerrors.json`);
          } else {
            console.log('[ok] zero pageerrors');
          }

          await browser.close();
          console.log('Done.');
          PWEND
          node prints.mjs 2>&1 | tee prints.log

      # v3.1 Fable: hash-check final. Se 3+ PNGs tem MD5 identico, o
      # script provavelmente renderizou a mesma tela varias vezes
      # (ex: onboarding repetido em vez de painel) — falha o run.
      - name: Hash check (deteca telas duplicadas)
        run: |
          set -e
          cd prints
          declare -A hashes
          for f in *.png; do
            h=$(md5sum "$f" | awk '{print $1}')
            hashes[$h]="${hashes[$h]:-} $f"
          done
          DUPLICADAS=0
          for h in "${!hashes[@]}"; do
            arr=(${hashes[$h]})
            if [ "${#arr[@]}" -ge 3 ]; then
              echo "[FAIL] $h aparece em ${#arr[@]} arquivos: ${hashes[$h]}"
              DUPLICADAS=$((DUPLICADAS + 1))
            fi
          done
          if [ "$DUPLICADAS" -gt 0 ]; then
            echo "::error::$DUPLICADAS grupos de PNGs identicos — script renderizou a mesma tela. Investigar."
            exit 1
          fi
          echo "[ok] cada tela tem hash unico"

      - name: Empacotar
        id: pack
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          NAME="sanova-prints-v2-${STAMP}.zip"
          (cd prints && zip -qr "../$NAME" *.png _pageerrors.json 2>/dev/null || (cd prints && zip -qr "../$NAME" *.png))
          echo "zip_name=$NAME" >> $GITHUB_OUTPUT
          ls -lh "$NAME"

      - name: Upload artifact (zip)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip_name || 'sanova-prints' }}
          path: |
            ${{ steps.pack.outputs.zip_name }}
            prints/
            prints.log
          retention-days: 14

      # v3.1 (Fable): publica como asset de Release com tag fixa.
      # URL estavel e PUBLICA (sem login). Sobrescreve a cada run.
      # https://github.com/sanovaapp/sanova/releases/download/prints-latest/sanova-prints-latest.zip
      - name: Publica zip como Release asset (URL publica fixa)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.pack.outputs.zip_name }}
        run: |
          set -e
          # Renomeia pro nome fixo (estavel)
          cp "$ZIP" sanova-prints-latest.zip
          # Cria a release se nao existe (tag fixa prints-latest)
          gh release view prints-latest >/dev/null 2>&1 \
            || gh release create prints-latest sanova-prints-latest.zip \
                --title "Sanova — prints (latest)" \
                --notes "Pacote visual mais recente. Atualizado a cada run do workflow Prints. URL estavel; sobrescreve a cada execucao." \
                --prerelease
          # Upload sobrescrevendo (--clobber) E mantem nome estavel
          gh release upload prints-latest sanova-prints-latest.zip --clobber
          echo "ASSET URL: https://github.com/${{ github.repository }}/releases/download/prints-latest/sanova-prints-latest.zip"

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Pacote visual v2"
            echo ""
            echo "**URL pública fixa (assets de Release):**"
            echo "https://github.com/${{ github.repository }}/releases/download/prints-latest/sanova-prints-latest.zip"
            echo ""
            echo "Status seed: ${{ github.event.inputs.simulate_active }}"
            echo "Fixture: completa-v1 (7d daily, 7 pesagens, aplicacao recente)"
            echo ""
            echo "### Arquivos"
            ls -la prints/ 2>/dev/null || echo "(sem prints)"
            echo ""
            echo "### Pageerrors capturados"
            if [ -f prints/_pageerrors.json ]; then
              cat prints/_pageerrors.json
            else
              echo "(zero pageerrors)"
            fi
            echo ""
            echo "Zip: ${{ steps.pack.outputs.zip_name }}"
          } >> $GITHUB_STEP_SUMMARY
