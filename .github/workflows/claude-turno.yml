name: Turno Autonomo (Claude)

# Autonomia nivel 2: aqui quem acorda e DECIDE, nao um script executando
# lista pronta.
#
#   heartbeat.yml  -> NARRA o estado (1x/dia, deterministico)
#   worker.yml     -> MUDA o estado dentro de uma fila fixa (3/3h, deterministico)
#   claude-turno   -> LE a Sala, JULGA o que fazer, e faz  (3/3h, com modelo)
#
# O briefing vive em automation/briefing-turno.md, fora do YAML — de proposito.
# Pra mudar o comportamento do agente, edite aquele arquivo, nao este.
#
# INERTE SEM A KEY: se o secret ANTHROPIC_API_KEY nao existir, o job termina
# verde sem gastar nada e escreve o motivo no summary. No minuto em que o
# secret for criado, o proximo cron ja roda de verdade — sem passo extra.
#
# Cron: '47 */6 * * *' = 4x por dia, sempre 30 min depois de um ciclo do
# worker (17 */3), pra ler a fila ja atualizada em vez de disputar com ela.
#
# Por que 6h e nao 3h: o primeiro run real custou US$ 0,39 (20 turnos, 71s)
# fazendo uma tarefa RASA. A 3/3h isso da ~US$ 92/mes; a 6/6h, ~US$ 46. Trocar
# o intervalo e uma linha — se o turno autonomo provar que entrega, sobe.

# ─── CRON DESLIGADO EM 14/08/2026 ────────────────────────────────────
#
# Decisao do Bruno, e ela esta certa. O balanco de uma semana rodando:
#
#   - produziu 1 PR (a #257), que ficou 4 dias parada sem ninguem avaliar
#   - morreu em silencio e falhou 8 vezes seguidas sem nada avisar
#   - custava ~US$46/mes pra isso
#
# O erro de premissa foi meu: montei o robo supondo que o gargalo era falta
# de horas de programacao. Nao era. O gargalo e a Play Store, e nela o robo
# nao toca — exige login pessoal do Bruno.
#
# Robo que trabalha enquanto ninguem revisa nao acelera nada: so acumula PR
# nao lida. Com o Bruno acompanhando de perto, a sessao interativa entrega
# mais e custa menos.
#
# O QUE FICA LIGADO, e por que vale:
#   claude-mencao.yml — "@claude ..." em issue ou PR. Custa ZERO parado, e
#                       deixa ele mandar servico do celular.
#   worker.yml        — a fila de vigilancia. Nao usa modelo nenhum, so
#                       minutos de Action. Foi ela que pegou a versao no ar
#                       divergindo e os secrets faltando.
#
# PRA RELIGAR: descomentar as duas linhas abaixo. Vale a pena quando houver
# fila de trabalho bem especificado E o Bruno estiver longe por dias.

on:
  # schedule:
  #   - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      foco:
        description: 'Instrucao extra pra este disparo (opcional)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: claude-turno
  cancel-in-progress: false

jobs:
  turno:
    runs-on: ubuntu-latest
    steps:
      # `secrets` nao existe no `if:` de job — por isso o gate e um step.
      - name: Confere se a chave da API existe
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ativo=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Turno autonomo inerte"
              echo ''
              echo 'O secret `ANTHROPIC_API_KEY` ainda nao foi criado, entao'
              echo 'este disparo terminou sem gastar nada.'
              echo ''
              echo 'Pra ligar: Settings -> Secrets and variables -> Actions ->'
              echo 'New repository secret, com o nome exato `ANTHROPIC_API_KEY`.'
              echo 'O proximo cron ja roda de verdade, sem mais nenhum passo.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ativo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ativo == 'true'
        with:
          fetch-depth: 0

      - name: Trabalha o turno
        if: steps.gate.outputs.ativo == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          display_report: true
          # O run de teste da instalacao terminou com 12 permission denials —
          # o agente gastou turnos batendo em ferramenta bloqueada em vez de
          # trabalhar. Regra de permissao e ADITIVA (concede sem perguntar,
          # nao remove nada), entao liberar Bash e WebFetch e seguro e corta
          # a maior parte das negativas.
          settings: |
            {"permissions": {"allow": ["Bash", "WebFetch"]}}
          prompt: |
            Leia `automation/briefing-turno.md` na raiz do repositorio e siga
            aquele briefing por inteiro. Ele define quem voce e, o que fazer
            neste disparo, e — principalmente — os limites do que voce NAO faz
            sozinho. Leia tambem `docs/protocolo-sala.md`, que ele referencia.

            Foco extra pedido neste disparo (vazio = nenhum, siga o briefing
            normal): ${{ github.event.inputs.foco }}
          claude_args: |
            --max-turns 30
            --model claude-sonnet-5
