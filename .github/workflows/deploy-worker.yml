name: Deploy sanova-api Worker

# Roda automatico quando algo muda em worker/ (push na main)
# ou manualmente em Actions -> "Deploy sanova-api Worker" -> "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # v1.26.0+: wrangler 4 (instalado em /worker) exige Node >=22.
          # Sem isso, wrangler-action faz fallback pra 3.90 e 'secret bulk'
          # quebra com API nova do Cloudflare ('5 secrets failed to upload').
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Em cada deploy: re-injeta esses secrets dentro do Worker
          # (sobrescreve idempotentemente). Eles SO existem em runtime no
          # Cloudflare; o repo nunca os ve em texto plano.
          secrets: |
            GEMINI_API_KEY
            MP_ACCESS_TOKEN_SANDBOX
            MP_ACCESS_TOKEN_PROD
            MP_WEBHOOK_SECRET
            SUPABASE_SERVICE_ROLE_KEY
            ADMIN_OVERRIDE_TOKEN
            DEMO_REVIEW_PASSWORD
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MP_ACCESS_TOKEN_SANDBOX: ${{ secrets.MP_ACCESS_TOKEN_SANDBOX }}
          # v1.31.3: token de producao disponivel no Worker, mas so USADO
          # quando MP_MODE=prod. Enquanto MP_MODE nao for setado, o padrao e
          # sandbox — dinheiro real nao passa por acidente. Dia de comercializar:
          # setar a variavel de repo MP_MODE=prod (ver LANCAMENTO.md).
          MP_ACCESS_TOKEN_PROD: ${{ secrets.MP_ACCESS_TOKEN_PROD }}
          MP_MODE: ${{ vars.MP_MODE }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # v1.24.0: GitHub Actions usa esse token no header X-Admin-Token
          # pra acionar /api/admin-* (workflow gateway + cron).
          ADMIN_OVERRIDE_TOKEN: ${{ secrets.ADMIN_OVERRIDE_TOKEN }}
          # v1.28.10: senha estavel da conta-demo Mariana (demo@sanova.app).
          # Usada pelo Google revisar Play Store. So' Bruno conhece — se nao
          # estiver setado em GitHub Secrets, _criarOuEncontrarUser volta a
          # rotacionar UUID aleatorio (comportamento antigo).
          DEMO_REVIEW_PASSWORD: ${{ secrets.DEMO_REVIEW_PASSWORD }}
