name: Demonstração — manter dados em dia

# Os pacientes fictícios do painel têm registros "de hoje" e "desta semana".
# Sem refazer todo dia, eles envelhecem e o painel de demonstração mostra
# todo mundo como "sem registro há N dias".
on:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refaz os dados de demonstração
        env:
          ADMIN_OVERRIDE_TOKEN: ${{ secrets.ADMIN_OVERRIDE_TOKEN }}
        run: |
          curl -sS --fail-with-body -o /dev/null -w "HTTP %{http_code}\n" -H "X-Admin-Token: $ADMIN_OVERRIDE_TOKEN" "https://sanova-api.contatosanovaapp.workers.dev/api/admin-seed-demo"
