<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Preview Paywall — Sanova</title>
<style>
  :root {
    --ss: system-ui, -apple-system, sans-serif;
    --fd: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: linear-gradient(180deg, #052413, #0a1f0e);
    color: #fff;
    font-family: var(--ss);
    min-height: 100vh;
  }
  .controls {
    position: fixed;
    bottom: 16px; left: 16px; right: 16px;
    z-index: 9999;
    display: flex; gap: 8px; flex-wrap: wrap;
    background: rgba(0,0,0,.7);
    padding: 12px;
    border-radius: 12px;
    backdrop-filter: blur(8px);
  }
  .controls button {
    flex: 1; min-width: 90px;
    padding: 9px 12px;
    border: 1px solid rgba(187,247,208,.3);
    background: rgba(187,247,208,.08);
    color: #bbf7d0;
    border-radius: 8px;
    font-family: var(--ss);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .controls button.active {
    background: rgba(187,247,208,.25);
    border-color: #bbf7d0;
  }
  .header {
    padding: 80px 20px 20px;
    text-align: center;
  }
  .header h1 {
    font-family: var(--fd);
    margin: 0 0 6px;
    font-size: 22px;
    letter-spacing: -.02em;
  }
  .header p {
    margin: 0;
    color: rgba(255,255,255,.6);
    font-size: 13px;
  }
  .mock-app {
    margin: 20px;
    padding: 16px;
    background: rgba(187,247,208,.05);
    border: 1px dashed rgba(187,247,208,.2);
    border-radius: 12px;
    color: rgba(255,255,255,.5);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<!-- ─── BANNER TRIAL (fixo no topo) ─────────────────────── -->
<div id="banner" style="position:fixed;top:0;left:0;right:0;z-index:1500;padding:10px 14px;background:linear-gradient(90deg,#0a3a20,#15803d 60%,#0a3a20);color:#fff;font-family:var(--ss);font-size:12.5px;line-height:1.4;border-bottom:1px solid rgba(187,247,208,.25);box-shadow:0 4px 12px rgba(0,0,0,.25)">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span style="font-size:14px">🎁</span>
    <span style="flex:1;min-width:140px"><b>Sanova Completo</b> liberado · restam <b>7 dias</b></span>
    <button onclick="abrirModal('banner')" style="padding:5px 11px;border-radius:99px;border:1px solid rgba(187,247,208,.5);background:rgba(187,247,208,.12);color:#bbf7d0;font-family:var(--ss);font-size:11.5px;font-weight:700;cursor:pointer">Assinar</button>
    <button aria-label="Fechar" onclick="document.getElementById('banner').style.display='none'" style="background:transparent;border:0;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;padding:0 4px;line-height:1">×</button>
  </div>
</div>

<div class="header">
  <h1>🌿 Preview do Paywall</h1>
  <p>v3.6.0 — toca nos botões pra alternar estado</p>
</div>

<div class="mock-app">
  Aqui ficaria o app normal do Sanova.<br>
  Cards de medicação, dashboard, etc.
</div>

<div class="controls">
  <button class="active" onclick="setState('trial', this)">Banner trial</button>
  <button onclick="setState('expirou', this); abrirModal('expirou')">Modal expirou</button>
  <button onclick="setState('clean', this)">Limpar tela</button>
</div>

<script>
function setState(s, btn){
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.getElementById('banner').style.display = (s === 'trial') ? '' : 'none';
  if(s !== 'expirou') fecharModal();
}

var FEATURES_PAGAS = [
  { icon: '🧠', nome: 'IA de prato', desc: 'Aponta a câmera, fala ou escreve. A IA reconhece a refeição e estima macros em segundos. Esquece caderninho e app gringo que não pega comida brasileira.' },
  { icon: '💉', nome: 'Conversor UI insulina', desc: 'Quem usa frasco manipulado sabe: errar a UI é fácil e perigoso. O Sanova calcula mg → UI no instante. Você só confirma e aplica.' },
  { icon: '📄', nome: 'Relatório PDF pro médico', desc: 'Chega na consulta com um resumo do mês: peso, doses, padrão de saciedade. Médico lê em 1 minuto. Você poupa a conversa de tentar lembrar.' }
];

function modalHTML(motivo){
  var titulo = motivo === 'expirou' ? 'Seus 7 dias acabaram 🌿' : 'Sanova Completo';
  var subtitulo = motivo === 'expirou'
    ? 'Continua usando o básico de graça ou libera o pacote completo.'
    : 'Você ainda está no período gratuito. Quer garantir o acesso completo?';

  var featPagas = FEATURES_PAGAS.map(function(f){
    return '<div style="display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid rgba(187,247,208,.08)">' +
      '<div style="font-size:22px;line-height:1;flex-shrink:0">'+f.icon+'</div>' +
      '<div style="flex:1"><div style="font-weight:800;color:#fff;font-size:14px;margin-bottom:2px">'+f.nome+'</div>' +
      '<div style="font-size:12.5px;color:rgba(255,255,255,.75);line-height:1.5">'+f.desc+'</div></div>' +
    '</div>';
  }).join('');

  return '<div style="max-width:460px;width:100%;max-height:92vh;overflow-y:auto;background:linear-gradient(158deg,#041b0d 0%,#0a3a20 52%,#052413 100%);border-radius:18px;padding:22px;border:1.5px solid rgba(187,247,208,.25)" onclick="event.stopPropagation()">' +
    '<div style="text-align:center;margin-bottom:14px">' +
      '<div style="font-size:34px;margin-bottom:4px">🌿</div>' +
      '<div style="font-size:18px;font-weight:800;color:#fff;font-family:var(--fd);letter-spacing:-.02em">'+titulo+'</div>' +
      '<div style="font-size:12.5px;color:rgba(255,255,255,.7);margin-top:4px;line-height:1.45">'+subtitulo+'</div>' +
    '</div>' +
    '<div style="margin-bottom:18px">' +
      '<div style="font-size:11px;font-weight:800;color:#86efac;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px">Inclui no Completo</div>' +
      featPagas +
    '</div>' +
    '<div style="display:flex;gap:10px;margin-bottom:14px;align-items:stretch">' +
      '<div style="flex:1;padding:14px 10px;border-radius:12px;border:1.5px solid rgba(187,247,208,.35);background:rgba(187,247,208,.06);text-align:center;display:flex;flex-direction:column;justify-content:center">' +
        '<div style="font-size:10.5px;color:rgba(255,255,255,.6);font-weight:700;text-transform:uppercase;letter-spacing:.04em">Mensal</div>' +
        '<div style="font-size:22px;color:#fff;font-weight:800;margin-top:5px;line-height:1">R$ 19,90</div>' +
        '<div style="font-size:10.5px;color:rgba(255,255,255,.55);margin-top:3px">por mês</div>' +
      '</div>' +
      '<div style="flex:1;padding:14px 10px;border-radius:12px;border:2px solid #bbf7d0;background:linear-gradient(160deg,rgba(34,197,94,.18),rgba(187,247,208,.10));text-align:center;position:relative;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 18px rgba(34,197,94,.18)">' +
        '<div style="position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#bbf7d0;color:#052413;font-size:9.5px;font-weight:900;padding:3px 9px;border-radius:99px;letter-spacing:.05em;white-space:nowrap;text-transform:uppercase">Mais escolhido</div>' +
        '<div style="font-size:10.5px;color:rgba(255,255,255,.6);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:4px">Anual</div>' +
        '<div style="font-size:11.5px;color:rgba(255,255,255,.5);text-decoration:line-through;margin-top:3px;line-height:1">R$ 238,80</div>' +
        '<div style="font-size:22px;color:#fff;font-weight:800;margin-top:2px;line-height:1">R$ 199</div>' +
        '<div style="font-size:10.5px;color:#bbf7d0;margin-top:3px;font-weight:700">2 meses grátis</div>' +
      '</div>' +
    '</div>' +
    '<button style="width:100%;padding:13px;border-radius:11px;border:0;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-family:var(--ss);font-size:14px;font-weight:800;cursor:pointer;margin-bottom:7px;box-shadow:0 4px 12px rgba(34,197,94,.3)">Assinar agora 🌿</button>' +
    '<button onclick="fecharModal()" style="width:100%;padding:11px;border-radius:11px;border:1px solid rgba(255,255,255,.15);background:transparent;color:rgba(255,255,255,.75);font-family:var(--ss);font-size:13px;font-weight:600;cursor:pointer">Continuar usando o gratuito</button>' +
    '<div style="font-size:10.5px;color:rgba(255,255,255,.45);text-align:center;margin-top:10px;line-height:1.45">Cobrança via Mercado Pago. Cancele quando quiser nas configurações. Direito de arrependimento de 7 dias (CDC Art. 49).</div>' +
  '</div>';
}

function abrirModal(motivo){
  fecharModal();
  var ov = document.createElement('div');
  ov.id = 'modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9998;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(4px)';
  ov.onclick = function(e){ if(e.target === ov) fecharModal(); };
  ov.innerHTML = modalHTML(motivo);
  document.body.appendChild(ov);
}

function fecharModal(){
  var m = document.getElementById('modal');
  if(m) m.remove();
}
</script>
</body>
</html>
