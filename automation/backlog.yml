# 🌿 Fila de trabalho autônomo do Sanova
#
# Lida e executada pelo worker (.github/scripts/worker.mjs), disparado de hora
# em hora pelo cron. Cada tarefa aqui é DETERMINISTICA — o worker não decide
# nada, só executa o que está descrito e anota o resultado.
#
# Trabalho que exige julgamento continua vindo do Code (sessao interativa) ou,
# quando o Bruno cravar a API key, da Claude Code Action.
#
# ─── Como escrever uma tarefa ────────────────────────────────────────
#
#   - id: identificador-unico
#     title: Frase curta que vai pro turno na Sala
#     type: http_check | worker_version | app_version | dispatch | pr_merged
#     status: pending | done | failed | blocked   (o worker escreve aqui)
#     params: {...}                                (depende do type)
#     blocked_by: [id-de-outra-tarefa]             (opcional)
#     repeat: true                                 (opcional — reexecuta mesmo
#                                                   depois de done; use pra
#                                                   monitores permanentes)
#
# ─── Tipos disponiveis ───────────────────────────────────────────────
#
#   http_check      params: url, expect_status (default 200), expect_contains
#   worker_version  params: expected            (bate contra /api/health)
#   app_version     params: expected            (bate contra SANOVA_VERSION no ar)
#   dispatch        params: workflow, inputs, requires_secret
#   pr_merged       params: number
#   supabase_table  params: table, should_exist (default true)
#   secret_present  params: name                (só "existe?", nunca lê o valor)
#
# O worker roda no maximo 6 tarefas por ciclo e nunca reexecuta uma tarefa
# `done` (a menos que tenha `repeat: true`). Falha nao trava a fila: a tarefa
# vira `failed`, as outras seguem, e o turno na Sala reporta.

tasks:
  # ─── Monitores permanentes (repeat) ────────────────────────────────

  - id: worker-no-ar
    title: Worker Cloudflare respondendo na versao esperada
    type: worker_version
    status: done
    repeat: true
    params:
      expected: "1.31.0"
    last_run: 2026-08-12T07:49:11.968Z
    last_result: v1.31.0

  - id: app-no-ar
    title: App servido pelo Pages na versao esperada
    type: app_version
    status: failed
    repeat: true
    params:
      expected: "3.10.60"
    last_run: 2026-08-12T07:49:11.968Z
    last_result: "no ar: 3.10.61 · esperado: 3.10.60"

  - id: verificacao-google-1
    title: Arquivo de verificacao do Search Console (principal) respondendo
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/googlec78077745bdb0836.html
      expect_contains: "google-site-verification"
    last_run: 2026-08-12T07:49:11.968Z
    last_result: HTTP 200

  - id: verificacao-google-2
    title: Arquivo de verificacao do Search Console (redundancia) respondendo
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/google4bf53c86e592090e.html
      expect_contains: "google-site-verification"
    last_run: 2026-08-12T10:18:19.833Z
    last_result: HTTP 200

  - id: politica-privacidade
    title: Politica de privacidade acessivel (exigencia da Play Store)
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/privacidade.html
      expect_contains: "Privacidade"
    last_run: 2026-08-12T10:18:19.833Z
    last_result: HTTP 200

  - id: pagina-exclusao
    title: Pagina de exclusao de conta acessivel (exigencia da Play Store)
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/exclusao.html
    last_run: 2026-08-12T10:18:19.833Z
    last_result: HTTP 200

  # ─── Vigilancia que ANTES era clique do Bruno (T84, Teste do Monitor) ──
  # Regra do CEO cravada no T84: antes de pedir qualquer coisa ao Bruno,
  # perguntar "isso pode virar monitor?". Estas quatro sao o "pode".
  # Reportam SO quando mudam de estado — enquanto seguem iguais, silencio.

  - id: play-app-publicado
    title: br.app.sanova visivel na Play Store (vira `done` no dia que publicar)
    type: http_check
    status: failed
    repeat: true
    params:
      url: https://play.google.com/store/apps/details?id=br.app.sanova
      expect_contains: "br.app.sanova"
    last_run: 2026-08-12T10:18:19.833Z
    last_result: HTTP 404 (esperado 200)

  - id: secret-play-service-account
    title: PLAY_SERVICE_ACCOUNT_JSON existe (destrava a automacao da Play)
    type: secret_present
    status: failed
    repeat: true
    params:
      name: PLAY_SERVICE_ACCOUNT_JSON
    last_run: 2026-08-12T10:18:19.833Z
    last_result: secret PLAY_SERVICE_ACCOUNT_JSON ainda nao existe no repo

  - id: secret-mp-prod
    title: MP_ACCESS_TOKEN_PROD existe (rotacao pendente desde a auditoria)
    type: secret_present
    status: done
    repeat: true
    params:
      name: MP_ACCESS_TOKEN_PROD
    last_run: 2026-08-12T10:18:19.833Z
    last_result: secret MP_ACCESS_TOKEN_PROD presente (75 caracteres)

  - id: secret-supabase-mgmt
    title: SUPABASE_MGMT_TOKEN existe (PAT expira — monitor pega a expiracao)
    type: secret_present
    status: done
    repeat: true
    params:
      name: SUPABASE_MGMT_TOKEN
    last_run: 2026-08-12T04:59:05.595Z
    last_result: secret SUPABASE_MGMT_TOKEN presente (44 caracteres)

  # A assinatura do app. Nasceu em junho dentro do ZIP do PWABuilder; se ela
  # nao bater, o Google recusa o envio da versao nova. Sem estes tres o
  # pipeline gera uma keystore aleatoria e o upload volta rejeitado — por isso
  # sao monitor, e nao lembrete: descobrir isso no dia da publicacao custa dias.
  - id: secret-keystore-play
    title: TWA_UPLOAD_KEYSTORE_B64 existe (assinatura do app; sem ela o Play recusa)
    type: secret_present
    status: failed
    repeat: true
    params:
      name: TWA_UPLOAD_KEYSTORE_B64
    last_run: 2026-08-12T04:59:05.595Z
    last_result: secret TWA_UPLOAD_KEYSTORE_B64 ainda nao existe no repo

  - id: secret-keystore-store-pwd
    title: TWA_UPLOAD_STORE_PWD existe (senha do arquivo de assinatura)
    type: secret_present
    status: failed
    repeat: true
    params:
      name: TWA_UPLOAD_STORE_PWD
    last_run: 2026-08-12T04:59:05.595Z
    last_result: secret TWA_UPLOAD_STORE_PWD ainda nao existe no repo

  - id: secret-keystore-key-pwd
    title: TWA_UPLOAD_KEY_PWD existe (senha da chave dentro do arquivo)
    type: secret_present
    status: failed
    repeat: true
    params:
      name: TWA_UPLOAD_KEY_PWD
    last_run: 2026-08-12T07:49:11.968Z
    last_result: secret TWA_UPLOAD_KEY_PWD ainda nao existe no repo

  # ─── Diagnostico de schema ─────────────────────────────────────────
  # Confere se as migrations ja estao aplicadas, usando o service_role que
  # ja existe no repo. Independe do PAT de management. Se estas passarem, a
  # migration correspondente e desnecessaria.

  - id: schema-alert-events
    title: Tabela alert_events existe (schema da Fase 2 aplicado)
    type: supabase_table
    status: done
    repeat: true
    params:
      table: alert_events
    last_run: 2026-08-12T07:49:11.968Z
    last_result: '"alert_events" existe'

  - id: schema-alert-prefs
    title: Tabela professional_alert_prefs existe (schema da Fase 2 aplicado)
    type: supabase_table
    status: done
    repeat: true
    params:
      table: professional_alert_prefs
    last_run: 2026-08-12T07:49:11.968Z
    last_result: '"professional_alert_prefs" existe'

  # ─── Tarefas de uma vez so ─────────────────────────────────────────

  - id: migration-rls-lockdown
    title: Aplicar migration de RLS lockdown do app_state
    type: dispatch
    status: done
    params:
      workflow: apply-supabase-migration.yml
      requires_secret: SUPABASE_MGMT_TOKEN
      inputs:
        file: supabase/migrations/20260729000000_app_state_rls_lockdown.sql
    last_run: 2026-08-07T04:22:00.206Z
    last_result: apply-supabase-migration.yml concluiu com sucesso

  - id: migration-fase2-alertas
    title: Aplicar migration do schema da Fase 2 (alertas)
    type: dispatch
    status: done
    blocked_by: [ migration-rls-lockdown ]
    params:
      workflow: apply-supabase-migration.yml
      requires_secret: SUPABASE_MGMT_TOKEN
      inputs:
        file: supabase/migrations/20260729010000_fase2_alertas.sql
    last_run: 2026-08-07T04:22:00.206Z
    last_result: apply-supabase-migration.yml concluiu com sucesso
