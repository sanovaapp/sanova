# 🌿 Fila de trabalho autônomo do Sanova
#
# Lida e executada pelo worker (.github/scripts/worker.mjs), disparado de hora
# em hora pelo cron. Cada tarefa aqui é DETERMINISTICA — o worker não decide
# nada, só executa o que está descrito e anota o resultado.
#
# Trabalho que exige julgamento continua vindo do Code (sessao interativa) ou,
# quando o Bruno cravar a API key, da Claude Code Action.
#
# ─── Como escrever uma tarefa ────────────────────────────────────────
#
#   - id: identificador-unico
#     title: Frase curta que vai pro turno na Sala
#     type: http_check | worker_version | app_version | dispatch | pr_merged
#     status: pending | done | failed | blocked   (o worker escreve aqui)
#     params: {...}                                (depende do type)
#     blocked_by: [id-de-outra-tarefa]             (opcional)
#     repeat: true                                 (opcional — reexecuta mesmo
#                                                   depois de done; use pra
#                                                   monitores permanentes)
#
# ─── Tipos disponiveis ───────────────────────────────────────────────
#
#   http_check      params: url, expect_status (default 200), expect_contains
#   worker_version  params: expected            (bate contra /api/health)
#   app_version     params: expected            (bate contra SANOVA_VERSION no ar)
#   dispatch        params: workflow, inputs, requires_secret
#   pr_merged       params: number
#
# O worker roda no maximo 6 tarefas por ciclo e nunca reexecuta uma tarefa
# `done` (a menos que tenha `repeat: true`). Falha nao trava a fila: a tarefa
# vira `failed`, as outras seguem, e o turno na Sala reporta.

tasks:
  # ─── Monitores permanentes (repeat) ────────────────────────────────

  - id: worker-no-ar
    title: Worker Cloudflare respondendo na versao esperada
    type: worker_version
    status: done
    repeat: true
    params:
      expected: "1.29.2"
    last_run: 2026-08-07T13:36:12.981Z
    last_result: v1.29.2

  - id: app-no-ar
    title: App servido pelo Pages na versao esperada
    type: app_version
    status: done
    repeat: true
    params:
      expected: "3.10.59"
    last_run: 2026-08-07T13:36:12.981Z
    last_result: v3.10.59

  - id: verificacao-google-1
    title: Arquivo de verificacao do Search Console (principal) respondendo
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/googlec78077745bdb0836.html
      expect_contains: "google-site-verification"
    last_run: 2026-08-07T13:36:12.981Z
    last_result: HTTP 200

  - id: verificacao-google-2
    title: Arquivo de verificacao do Search Console (redundancia) respondendo
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/google4bf53c86e592090e.html
      expect_contains: "google-site-verification"
    last_run: 2026-08-07T13:36:12.981Z
    last_result: HTTP 200

  - id: politica-privacidade
    title: Politica de privacidade acessivel (exigencia da Play Store)
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/privacidade.html
      expect_contains: "Privacidade"
    last_run: 2026-08-07T13:36:12.981Z
    last_result: HTTP 200

  - id: pagina-exclusao
    title: Pagina de exclusao de conta acessivel (exigencia da Play Store)
    type: http_check
    status: done
    repeat: true
    params:
      url: https://sanova.app.br/exclusao.html
    last_run: 2026-08-07T13:36:12.981Z
    last_result: HTTP 200

  # ─── Diagnostico de schema ─────────────────────────────────────────
  # Confere se as migrations ja estao aplicadas, usando o service_role que
  # ja existe no repo. Independe do PAT de management. Se estas passarem, a
  # migration correspondente e desnecessaria.

  - id: schema-alert-events
    title: Tabela alert_events existe (schema da Fase 2 aplicado)
    type: supabase_table
    status: pending
    repeat: true
    params:
      table: alert_events

  - id: schema-alert-prefs
    title: Tabela professional_alert_prefs existe (schema da Fase 2 aplicado)
    type: supabase_table
    status: pending
    repeat: true
    params:
      table: professional_alert_prefs

  # ─── Tarefas de uma vez so ─────────────────────────────────────────

  - id: migration-rls-lockdown
    title: Aplicar migration de RLS lockdown do app_state
    type: dispatch
    status: done
    params:
      workflow: apply-supabase-migration.yml
      requires_secret: SUPABASE_MGMT_TOKEN
      inputs:
        file: supabase/migrations/20260729000000_app_state_rls_lockdown.sql
    last_run: 2026-08-07T04:22:00.206Z
    last_result: apply-supabase-migration.yml concluiu com sucesso

  - id: migration-fase2-alertas
    title: Aplicar migration do schema da Fase 2 (alertas)
    type: dispatch
    status: done
    blocked_by: [ migration-rls-lockdown ]
    params:
      workflow: apply-supabase-migration.yml
      requires_secret: SUPABASE_MGMT_TOKEN
      inputs:
        file: supabase/migrations/20260729010000_fase2_alertas.sql
    last_run: 2026-08-07T04:22:00.206Z
    last_result: apply-supabase-migration.yml concluiu com sucesso
