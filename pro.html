<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a3a20">
<title>Sanova · Painel Profissional</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --bg:#041b0d; --bg2:#0a3a20; --bg3:#052413;
  --ink:#fff; --ink2:rgba(255,255,255,.78); --ink3:rgba(255,255,255,.55);
  --g50:rgba(255,255,255,.04); --g100:rgba(255,255,255,.08);
  --g200:rgba(255,255,255,.18); --g300:rgba(255,255,255,.3);
  --accent:#86efac; --accent2:#bbf7d0; --accent-dim:rgba(134,239,172,.18);
  --warn:#fcd34d; --danger:#fca5a5;
  --cream1:#f5f1e8; --cream2:#ebe5d4; --cream3:rgba(255,255,255,.18);
  --ss:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fd:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 60%,var(--bg3) 100%);color:var(--ink);font-family:var(--ss);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}

#app{max-width:480px;margin:0 auto;padding:18px 16px 60px;min-height:100vh}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.brand-logo{font-size:26px}
.brand-name{font-family:var(--fd);font-size:22px;font-weight:500;letter-spacing:-.01em}
.brand-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);background:var(--accent-dim);padding:3px 8px;border-radius:99px;border:1px solid rgba(134,239,172,.3)}

.card{background:linear-gradient(158deg,#041b0d 0%,#0a3a20 52%,#052413 100%);border:1px solid rgba(187,247,208,.22);border-radius:16px;padding:18px 16px;margin-bottom:14px}
.card-title{font-family:var(--fd);font-size:17px;font-weight:500;margin:0 0 4px}
.card-sub{font-size:12px;color:var(--ink3);margin-bottom:14px;line-height:1.5}

.fi{margin-bottom:12px}
.fi label{display:block;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fi input,.fi select,.fi textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--cream3);background:#fff;color:var(--bg);font-size:14px;outline:none;transition:border-color .15s}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:11px;border:1px solid var(--g300);background:var(--g100);color:var(--ink);font-size:13px;font-weight:700;width:100%;transition:all .15s}
.btn:hover{background:var(--g200)}
.btn-primary{background:linear-gradient(180deg,#22c55e,#16a34a);border-color:#16a34a;color:#fff}
.btn-primary:hover{background:linear-gradient(180deg,#16a34a,#15803d)}
.btn-ghost{background:transparent;border-color:var(--g200)}
.btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.3);color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.alert{padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;margin-bottom:12px;border:1px solid}
.alert-info{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.3);color:#dbeafe}
.alert-ok{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#bbf7d0}
.alert-warn{background:rgba(252,211,77,.08);border-color:rgba(252,211,77,.3);color:#fef3c7}
.alert-err{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:#fecaca}

.patient-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--g50);border:1px solid var(--g100);border-radius:12px;margin-bottom:8px;transition:all .15s;cursor:pointer;border-left-width:4px}
.patient-row:hover{background:var(--g100);border-color:var(--g200)}
.patient-row.estado-risco{background:rgba(243,168,138,.10);border-color:rgba(243,168,138,.32);border-left-color:#f3a88a}
.patient-row.estado-atencao{background:rgba(252,211,77,.08);border-color:rgba(252,211,77,.28);border-left-color:#fcd34d}
.patient-row.estado-protegida{background:rgba(134,239,172,.07);border-color:rgba(134,239,172,.28);border-left-color:#86efac}
.patient-row.estado-aguardando{border-left-color:rgba(255,255,255,.28)}
.patient-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#0a3a20);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:15px;position:relative}
.patient-row.estado-risco .patient-avatar{background:linear-gradient(135deg,#dc2626,#7f1d1d)}
.patient-row.estado-atencao .patient-avatar{background:linear-gradient(135deg,#d97706,#78350f)}
.patient-row.estado-protegida .patient-avatar{background:linear-gradient(135deg,#16a34a,#14532d)}
.patient-row.estado-aguardando .patient-avatar{background:linear-gradient(135deg,#475569,#1e293b)}
.patient-dot{position:absolute;top:-2px;right:-2px;width:14px;height:14px;border-radius:50%;border:2px solid #041b0d;font-size:8px;display:flex;align-items:center;justify-content:center}
.patient-info{flex:1;min-width:0}
.patient-name{font-weight:600;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.patient-meta{font-size:11px;color:var(--ink3);margin-top:1px}
.patient-meta .estado-tag{display:inline-block;font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:10px;padding:1px 6px;border-radius:99px;margin-right:5px}
.patient-meta .estado-tag.risco{color:#fca5a5;background:rgba(243,168,138,.15)}
.patient-meta .estado-tag.atencao{color:#fde68a;background:rgba(252,211,77,.16)}
.patient-meta .estado-tag.protegida{color:#bbf7d0;background:rgba(134,239,172,.16)}
.patient-meta .estado-tag.aguardando{color:rgba(255,255,255,.6);background:rgba(255,255,255,.06)}
.patient-arrow{font-size:18px;color:var(--ink3)}

.invite-box{padding:14px 16px;background:rgba(134,239,172,.08);border:1px dashed rgba(134,239,172,.3);border-radius:12px;text-align:center;margin-bottom:12px}
.invite-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:rgba(187,247,208,.6);margin-bottom:6px}
.invite-code{font-family:'SF Mono','Monaco','Courier New',monospace;font-size:28px;font-weight:800;color:var(--accent2);letter-spacing:3px;padding:4px 0}
.invite-hint{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:6px}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{padding:11px;background:var(--g50);border-radius:10px;border:1px solid var(--g100)}
.kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:4px}
.kpi-val{font-size:18px;font-weight:700;color:var(--ink);font-family:var(--fd)}
.kpi-hint{font-size:10.5px;color:var(--ink3);margin-top:2px}

.section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin:18px 0 10px}

.janelas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.janela-card{background:var(--g50);border:1px solid var(--g100);border-radius:10px;padding:8px 4px;text-align:center;border-top-width:3px;min-width:0}
.janela-card.janela-risco{border-top-color:#f3a88a;background:rgba(243,168,138,.06)}
.janela-card.janela-atencao{border-top-color:#fcd34d;background:rgba(252,211,77,.05)}
.janela-card.janela-protegida{border-top-color:#86efac;background:rgba(134,239,172,.05)}
.janela-card.janela-aguardando{border-top-color:rgba(255,255,255,.18)}
.janela-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);margin-bottom:4px}
.janela-dot{font-size:16px;line-height:1;margin-bottom:3px}
.janela-est{font-size:10.5px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.janela-meta{font-size:9px;color:var(--ink3);line-height:1.25}

.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);background:none;border:none;padding:6px 0;margin-bottom:6px}
.back-btn:hover{color:var(--accent)}

.empty{padding:24px 16px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.5;background:var(--g50);border-radius:12px;border:1px dashed var(--g200)}

.loader{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.footer-note{font-size:10.5px;color:rgba(255,255,255,.35);text-align:center;margin-top:32px;line-height:1.6}
.footer-note a{color:rgba(187,247,208,.5)}

.upload-zone{display:flex;align-items:center;gap:10px;padding:10px;background:var(--g50);border:1px dashed var(--g200);border-radius:10px;margin-bottom:8px}
.upload-zone img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--g100)}
.upload-zone label{flex:1;font-size:11.5px;color:var(--ink3);cursor:pointer}
.upload-zone label strong{color:var(--ink2);display:block;font-size:12px;margin-bottom:2px}

.hr{height:1px;background:rgba(255,255,255,.08);margin:14px 0;border:none}
</style>
</head>
<body>
<div id="app">
  <div class="brand">
    <div class="brand-logo">🌿</div>
    <div class="brand-name">Sanova</div>
    <div class="brand-tag">Pro</div>
  </div>
  <div id="content">
    <div class="empty"><div class="loader"></div><div style="margin-top:8px">Carregando…</div></div>
  </div>
  <div class="footer-note">
    Painel para profissionais cadastrados.<br>
    Você precisa do código de convite do seu paciente pra acessar os dados.<br>
    <a href="/privacidade.html">Política de privacidade</a> · <a href="index.html">App do paciente</a>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
'use strict';

const SUPABASE_URL = 'https://yjycpcydqfuvojfzwfvy.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlqeWNwY3lkcWZ1dm9qZnp3ZnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkwMzY4NDksImV4cCI6MjA2NDYxMjg0OX0.gZuFaI0Lz2GjY3PUWPaeoyhuJyz4PpIVTvshNd6cKAQ';
const WORKER_BASE = 'https://sanova-api.contatosanovaapp.workers.dev';
// Fase 2 — alertas ao profissional. LIGADA em 07/08/2026.
//
// Ficou atras desta flag desde o T66 esperando o Bruno cravar os limiares.
// Hoje ele mandou parar de travar fila esperando decisao: escolher o padrao
// sensato, entregar, e ele revoga se estiver errado.
//
// O padrao escolhido e o mais conservador que ja existe no codigo, e nao
// precisou de nenhuma linha nova: as preferencias nascem com os 5 alertas
// VERMELHOS em 'imediato' e os 5 AMARELOS em 'off' (alerts.js:327). Ou seja,
// ligar a flag entrega exatamente "so os vermelhos" — os amarelos so aparecem
// se o profissional pedir, um a um, na tela de Preferencias.
//
// Racional clinico: vermelho e o que protege (piso calorico, sintomas GI
// persistentes, sinais raros graves, perda rapida, dose atrasada). Amarelo
// e o que incomoda. Profissional que se acostuma a ignorar amarelo passa a
// ignorar vermelho junto — e ai a camada inteira vira ruido.
//
// A deteccao continua rodando so por disparo manual do workflow. Cron diario
// e o proximo passo, depois de olhar os primeiros alertas reais.
const FASE2_ALERTAS_ATIVA = true;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = (id) => document.getElementById(id);

let state = {
  user: null,
  pro: null,
  patients: [],
  view: 'loading',
  selectedLinkId: null,
};

async function apiCall(path, opts = {}) {
  const session = (await sb.auth.getSession()).data.session;
  if (!session) throw new Error('not_authenticated');
  const res = await fetch(WORKER_BASE + path, {
    ...opts,
    headers: {
      ...(opts.headers || {}),
      'Authorization': 'Bearer ' + session.access_token,
      'Content-Type': 'application/json',
    },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'http_' + res.status);
    err.data = data;
    err.status = res.status;
    throw err;
  }
  return data;
}

function setView(v) {
  state.view = v;
  render();
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
}

function avatarLetter(nome) {
  // v3.10.32 hardening Fable: sanitiza pra alphanumeric + acentos pra eliminar
  // qualquer chance de injecao via primeiro char do nome/email.
  const c = (nome || '?').trim().charAt(0).toUpperCase();
  return /^[A-Za-zÀ-ÿ0-9]$/.test(c) ? c : '?';
}

// ─── Views ──────────────────────────────────────────────────────────

function viewLogin() {
  return `
    <div class="card">
      <h2 class="card-title">Acessar painel profissional</h2>
      <p class="card-sub">Use seu email cadastrado. Enviamos um link de acesso instantâneo (sem senha).</p>
      <div class="fi">
        <label>Email profissional</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="seu@email.com">
      </div>
      <button class="btn btn-primary" onclick="enviarMagicLink()">Enviar link de acesso</button>
      <div id="loginMsg"></div>
    </div>
    <div class="alert alert-info">
      <strong>Primeira vez aqui?</strong><br>
      Após o login, oferecemos o cadastro como nutrólogo, nutricionista ou médico.
    </div>
  `;
}

function viewRegister() {
  return `
    <div class="card">
      <h2 class="card-title">Cadastro de profissional</h2>
      <p class="card-sub">Esses dados aparecem pro seu paciente no app dele (co-branding). Você pode editar depois.</p>
      <div class="fi">
        <label>Seu nome completo *</label>
        <input id="regNome" type="text" autocomplete="name" placeholder="Dr(a). Nome Sobrenome">
      </div>
      <div class="fi">
        <label>Categoria *</label>
        <select id="regTipo">
          <option value="">— selecione —</option>
          <option value="medico">Médico(a)</option>
          <option value="nutricionista">Nutricionista</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div class="fi">
        <label>Registro (CRM, CRN, etc)</label>
        <input id="regRegistro" type="text" placeholder="ex: CRN-3 12345 / SP">
      </div>
      <div class="fi">
        <label>Como você quer aparecer pro paciente</label>
        <input id="regTitulo" type="text" placeholder="ex: Nutricionista · CRN-3 12345">
      </div>
      <!-- v1.6.0 (Fable T50): aceite obrigatorio do termo pro.
           Fronteira regulatoria — Sanova sinaliza, nao substitui conduta. -->
      <label style="display:flex;align-items:flex-start;gap:9px;padding:11px 12px;background:rgba(187,247,208,.06);border:1px solid rgba(187,247,208,.2);border-radius:10px;font-size:12px;line-height:1.5;color:rgba(255,255,255,.85);cursor:pointer;margin-bottom:14px">
        <input id="regAceiteTermo" type="checkbox" style="margin-top:2px;flex-shrink:0;cursor:pointer">
        <span>
          <strong style="color:#bbf7d0">Eu reconheço:</strong>
          o Sanova pode sinalizar sinais de risco, mas <strong>não substitui o monitoramento clínico contínuo</strong>. Ausência de alerta não significa ausência de risco. Toda intervenção clínica (dose, conduta, prescrição, diagnóstico) acontece pelos meus canais habituais (consulta presencial, telemedicina formal, contato direto) — não pelo Sanova. Alertas críticos podem disparar mesmo com notificações desligadas (responsabilidade clínica). <span style="color:rgba(255,255,255,.5)">(termo pro v1-2026-06)</span>
        </span>
      </label>
      <button class="btn btn-primary" onclick="cadastrarPro()">Concluir cadastro</button>
      <button class="btn btn-ghost" style="margin-top:8px" onclick="logout()">Sair</button>
      <div id="regMsg"></div>
    </div>
  `;
}

function viewProPanel() {
  const pro = state.pro;
  const inviteCode = escapeHtml(pro.invite_code || '');
  const nome = escapeHtml(pro.nome || '');
  const titulo = escapeHtml(pro.titulo_exibido || (pro.tipo === 'medico' ? 'Médico(a)' : pro.tipo === 'nutricionista' ? 'Nutricionista' : 'Profissional'));

  let pacientesHtml = '';
  if (!state.patients.length) {
    pacientesHtml = `
      <div class="empty">
        <strong>Sem pacientes vinculados ainda.</strong><br>
        Compartilhe seu código <strong>${inviteCode}</strong> com pacientes do Sanova.<br>
        Eles entram no app, vão em <em>Mais → Vincular profissional</em> e colam o código.
      </div>
    `;
  } else {
    const DOT = { risco: '🔴', atencao: '🟡', protegida: '🟢', aguardando: '⚪' };
    const LBL = { risco: 'Risco', atencao: 'Atenção', protegida: 'Protegida', aguardando: 'Aguardando' };
    pacientesHtml = state.patients.map(p => {
      const pnome = escapeHtml(p.nome || p.email || 'Paciente');
      const estado = (p.estado_pm || 'aguardando').toLowerCase();
      const dotEmoji = DOT[estado] || DOT.aguardando;
      const lbl = LBL[estado] || LBL.aguardando;
      const meta = [];
      meta.push(`<span class="estado-tag ${estado}">${lbl}</span>`);
      if (typeof p.dias_sem_registro === 'number') {
        meta.push(p.dias_sem_registro === 0 ? 'registrou hoje' : `${p.dias_sem_registro}d sem registro`);
      }
      const metaStr = meta.join(' · ');
      // v3.10.32 hardening Fable: data-link-id + listener (escapeHtml nao
      // serve pra contexto JS dentro de onclick). Risco real baixo (link_id
      // eh UUID do server) mas elimina a classe inteira.
      return `
        <div class="patient-row estado-${estado}" data-link-id="${escapeHtml(p.link_id)}">
          <div class="patient-avatar">${avatarLetter(p.nome || p.email)}<span class="patient-dot">${dotEmoji}</span></div>
          <div class="patient-info">
            <div class="patient-name">${pnome}</div>
            <div class="patient-meta">${metaStr}</div>
          </div>
          <div class="patient-arrow">›</div>
        </div>
      `;
    }).join('');
  }

  const foto = pro.foto_url
    ? `<img src="${escapeHtml(pro.foto_url)}" style="width:62px;height:62px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(134,239,172,.4)">`
    : `<div style="width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#0a3a20);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:24px">${avatarLetter(pro.nome)}</div>`;

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
          ${foto}
          <div style="min-width:0">
            <h2 class="card-title" style="margin-bottom:2px">${nome}</h2>
            <p class="card-sub" style="margin-bottom:0">${titulo}</p>
          </div>
        </div>
        <button class="btn btn-ghost" style="width:auto;padding:6px 12px;font-size:11px;flex-shrink:0" onclick="logout()">Sair</button>
      </div>
      <button class="btn btn-ghost" style="font-size:12px;padding:8px" onclick="abrirUploadFoto()">${pro.foto_url ? '🖼️ Trocar foto / logo' : '📷 Enviar foto / logo'}</button>
    </div>

    <div class="invite-box">
      <div class="invite-label">Seu código de convite</div>
      <div class="invite-code">${inviteCode}</div>
      <div class="invite-hint">Compartilhe com seu paciente. Ele cola em <em>Mais → Vincular profissional</em>.</div>
    </div>

    <div class="section-title">Pacientes (${state.patients.length})</div>
    ${pacientesHtml}

    ${FASE2_ALERTAS_ATIVA ? `
    <!-- v1.7.0 (Fase 2 Fable T49.1+T50): alertas ativos read-only -->
    <div class="section-title" style="margin-top:24px;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span>🔔 Alertas ativos <span id="alertsBadge" style="font-size:11px;color:rgba(187,247,208,.55);font-weight:400;margin-left:4px"></span></span>
      <button type="button" onclick="abrirPrefsAlertas()" style="background:none;border:1px solid rgba(187,247,208,.25);color:rgba(187,247,208,.7);font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;cursor:pointer">⚙️ Preferências</button>
    </div>
    <div id="alertsList"><div class="empty" style="font-size:12px">Carregando…</div></div>
    ` : ''}
  `;
}

// v1.8.0 (Fase 2 prefs): abre modal com checkbox por chave amarela.
// Chaves vermelhas aparecem read-only ("sempre imediato — dever de cuidado").
async function abrirPrefsAlertas() {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:99999;display:flex;align-items:center;justify-content:center;padding:14px;overflow-y:auto';
  ov.innerHTML = `
    <div style="background:linear-gradient(158deg,#041b0d 0%,#0a3a20 52%,#052413 100%);border:1px solid rgba(187,247,208,.22);border-radius:18px;padding:18px 14px;max-width:520px;width:100%;color:#fff;font-family:system-ui,-apple-system,sans-serif">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-family:Georgia,serif;font-size:17px;font-weight:500">⚙️ Preferências de alerta</div>
        <button type="button" onclick="this.closest('[data-prefs-ov]').remove()" style="background:none;border:none;color:rgba(255,255,255,.6);font-size:24px;cursor:pointer;padding:0 6px">×</button>
      </div>
      <div style="font-size:12px;color:rgba(187,247,208,.7);line-height:1.55;margin-bottom:14px;padding:10px 12px;background:rgba(187,247,208,.06);border:1px solid rgba(187,247,208,.15);border-radius:10px">
        Sanova sinaliza best-effort. <strong>Ausência de alerta não significa ausência de risco.</strong> Alertas 🔴 (críticos) sempre disparam — dever de cuidado clínico. Alertas 🟡 você escolhe a frequência.
      </div>
      <div id="prefsList"><div class="empty" style="font-size:12px">Carregando…</div></div>
    </div>
  `;
  ov.setAttribute('data-prefs-ov', '1');
  document.body.appendChild(ov);
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });

  try {
    const r = await apiCall('/api/pro-alerts-prefs');
    const prefs = r.prefs || [];
    const host = document.getElementById('prefsList');
    host.innerHTML = prefs.map((p) => {
      const dot = p.severity === 'red' ? '🔴' : '🟡';
      if (!p.editavel) {
        return `<div style="padding:12px 14px;background:rgba(232,168,138,.08);border:1px solid rgba(232,168,138,.22);border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div style="min-width:0"><div style="font-size:13px;font-weight:700;color:#f5f0e3">${dot} ${escapeHtml(p.label)}</div>
          <div style="font-size:10.5px;color:rgba(255,255,255,.55);margin-top:2px">Sempre imediato — dever de cuidado clínico</div></div>
          <div style="font-size:11px;color:rgba(187,247,208,.55);white-space:nowrap">imediato</div>
        </div>`;
      }
      return `<div style="padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:8px">
        <div style="font-size:13px;font-weight:700;color:#f5f0e3;margin-bottom:8px">${dot} ${escapeHtml(p.label)}</div>
        <select data-pref-key="${escapeHtml(p.alert_key)}" style="width:100%;padding:8px 10px;background:rgba(0,0,0,.35);border:1px solid rgba(187,247,208,.2);border-radius:8px;color:#fff;font-family:inherit;font-size:12.5px">
          <option value="off" ${p.frequencia === 'off' ? 'selected' : ''}>Desligado</option>
          <option value="imediato" ${p.frequencia === 'imediato' ? 'selected' : ''}>Imediato</option>
          <option value="diario" ${p.frequencia === 'diario' ? 'selected' : ''}>Diário (resumo)</option>
          <option value="semanal" ${p.frequencia === 'semanal' ? 'selected' : ''}>Semanal (resumo)</option>
          <option value="mensal" ${p.frequencia === 'mensal' ? 'selected' : ''}>Mensal (resumo)</option>
        </select>
      </div>`;
    }).join('');
    host.querySelectorAll('select[data-pref-key]').forEach((sel) => {
      sel.addEventListener('change', async () => {
        const alert_key = sel.getAttribute('data-pref-key');
        const frequencia = sel.value;
        sel.disabled = true;
        try {
          await apiCall('/api/pro-alerts-prefs', { method: 'POST', body: JSON.stringify({ alert_key, frequencia }) });
          sel.style.borderColor = '#86efac';
          setTimeout(() => { sel.style.borderColor = 'rgba(187,247,208,.2)'; }, 1200);
        } catch (e) {
          alert('Erro salvando: ' + (e.message || 'desconhecido'));
          sel.style.borderColor = '#f3a88a';
        } finally {
          sel.disabled = false;
        }
      });
    });
  } catch (e) {
    document.getElementById('prefsList').innerHTML = '<div class="empty" style="font-size:12px;color:#f3a88a">Erro: ' + escapeHtml(e.message || 'desconhecido') + '</div>';
  }
}

// v1.7.0 (Fase 2): busca /api/pro-alerts-list e renderiza inline.
async function carregarAlertasAtivos() {
  const host = document.getElementById('alertsList');
  const badge = document.getElementById('alertsBadge');
  if (!host) return;
  try {
    const r = await apiCall('/api/pro-alerts-list');
    const eventos = (r.eventos || []);
    if (badge) badge.textContent = eventos.length ? '(' + eventos.length + ')' : '';
    if (!eventos.length) {
      host.innerHTML = '<div class="empty" style="font-size:12px">Sem alertas ativos nos últimos 30 dias. Isso NÃO significa ausência de risco — Sanova sinaliza best-effort.</div>';
      return;
    }
    const SEV = { red: { icon: '🔴', color: '#f3a88a' }, yellow: { icon: '🟡', color: '#fcd34d' } };
    host.innerHTML = eventos.map(function(ev) {
      const s = SEV[ev.severity] || SEV.yellow;
      const quando = new Date(ev.triggered_at);
      const qStr = quando.toLocaleDateString('pt-BR') + ' ' + quando.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      return '<div class="patient-row" style="align-items:flex-start">'
        + '<div class="patient-avatar" style="background:transparent;font-size:22px">' + s.icon + '</div>'
        + '<div class="patient-info">'
        + '  <div class="patient-name" style="color:' + s.color + '">' + escapeHtml(ev.label || ev.alert_key) + '</div>'
        + '  <div class="patient-meta" style="white-space:normal;line-height:1.5">' + escapeHtml(ev.factual_message) + '</div>'
        + '  <div class="patient-meta" style="opacity:.55;margin-top:4px">Paciente ' + escapeHtml(ev.patient_user_id_curto) + ' · ' + qStr + '</div>'
        + '</div>'
        + '<button data-dismiss-id="' + escapeHtml(ev.id) + '" style="background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.55);font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer">✓ Dismissar</button>'
        + '</div>';
    }).join('');
    host.querySelectorAll('button[data-dismiss-id]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const id = btn.getAttribute('data-dismiss-id');
        dismissarAlerta(id);
      });
    });
  } catch (e) {
    host.innerHTML = '<div class="empty" style="font-size:12px;color:#f3a88a">Erro ao carregar alertas: ' + escapeHtml(e.message || 'desconhecido') + '</div>';
  }
}

async function dismissarAlerta(id) {
  try {
    await apiCall('/api/pro-alerts-dismiss', { method: 'POST', body: JSON.stringify({ event_id: id }) });
    carregarAlertasAtivos();
  } catch (e) {
    alert('Erro ao dismissar: ' + (e.message || 'desconhecido'));
  }
}

// Renderiza 3 mini-cards (7d/15d/30d) com o estado de cada janela.
// Permite o pro ver "no agora ela tá 🟢, mas 30d atras teve 🟡".
function renderJanelas(janelas) {
  if (!janelas) return '';
  const DOT = { risco: '🔴', atencao: '🟡', protegida: '🟢', aguardando: '⚪' };
  const LBL = { risco: 'Risco', atencao: 'Atenção', protegida: 'Protegida', aguardando: 'Sem dados' };
  const ORDER = [['7d', '7 dias'], ['15d', '15 dias'], ['30d', '30 dias'], ['60d', '60 dias']];
  const tem = ORDER.some(([k]) => janelas[k] && janelas[k].kcal > 0);
  if (!tem) return '';
  const cards = ORDER.map(([k, label]) => {
    const j = janelas[k] || {};
    const est = (j.estado || 'aguardando').toLowerCase();
    const dot = DOT[est] || DOT.aguardando;
    const lbl = LBL[est] || LBL.aguardando;
    const protPct = (typeof j.prot_pct === 'number') ? j.prot_pct + '% prot' : '';
    const kcalPct = (typeof j.kcal_pct === 'number') ? j.kcal_pct + '% kcal' : '';
    const detalhe = [protPct, kcalPct].filter(Boolean).join(' · ');
    return `
      <div class="janela-card janela-${est}">
        <div class="janela-lbl">${label}</div>
        <div class="janela-dot">${dot}</div>
        <div class="janela-est">${lbl}</div>
        <div class="janela-meta">${detalhe}</div>
      </div>
    `;
  }).join('');
  return `
    <hr class="hr">
    <div class="section-title" style="margin-top:0">Linha do tempo (janelas)</div>
    <div class="janelas-grid">${cards}</div>
  `;
}

function viewPatient() {
  const p = state.patientDetail;
  if (!p) {
    return `<div class="empty"><div class="loader"></div><div style="margin-top:8px">Carregando paciente…</div></div>`;
  }
  const SEM_DADO = '<span style="color:rgba(255,255,255,.35)">sem registro</span>';
  const nome = escapeHtml(p.nome || p.email || 'Paciente');
  const peso = (typeof p.peso_atual === 'number' && p.peso_atual > 0)
    ? p.peso_atual.toFixed(1) + ' kg' : SEM_DADO;
  const pesoDelta = (typeof p.peso_delta_30d === 'number')
    ? (p.peso_delta_30d <= 0 ? p.peso_delta_30d.toFixed(1) : '+' + p.peso_delta_30d.toFixed(1)) + ' kg/30d'
    : '';
  const kcal = (typeof p.kcal_media === 'number' && p.kcal_media > 0)
    ? Math.round(p.kcal_media) + ' kcal/dia' : SEM_DADO;
  const kcalHint = (typeof p.kcal_pct === 'number') ? p.kcal_pct + '% da meta' : '';
  const prot = (typeof p.prot_media === 'number' && p.prot_media > 0)
    ? Math.round(p.prot_media) + ' g/dia' : SEM_DADO;
  const protHint = (typeof p.prot_pct === 'number') ? p.prot_pct + '% da meta' : '';
  const estado = (p.estado_pm || 'aguardando').toLowerCase();
  const LBL_EST = { risco: 'Risco — músculo em perda', atencao: 'Atenção — proteja músculo',
                    protegida: 'Protegida — músculo em dia', aguardando: 'Aguardando dados' };
  const CLS_EST = { risco: 'alert-err', atencao: 'alert-warn',
                    protegida: 'alert-ok', aguardando: 'alert-info' };
  const lblEst = LBL_EST[estado] || LBL_EST.aguardando;
  const clsEst = CLS_EST[estado] || CLS_EST.aguardando;
  const msgEst = p.estado_pm_msg ? `<div style="font-size:11.5px;line-height:1.55;margin-top:4px;opacity:.85">${escapeHtml(p.estado_pm_msg)}</div>` : '';
  const ultDose = (typeof p.ultima_dose_ha_dias === 'number')
    ? (p.ultima_dose_ha_dias === 0 ? 'hoje' : 'há ' + p.ultima_dose_ha_dias + 'd')
    : SEM_DADO;

  return `
    <button class="back-btn" onclick="voltarParaLista()">‹ Voltar</button>
    <div class="card">
      <h2 class="card-title">${nome}</h2>
      <p class="card-sub">${escapeHtml(p.email || '')}</p>

      <div class="kpi-grid">
        <div class="kpi"><div class="kpi-lbl">Peso atual</div><div class="kpi-val">${peso}</div><div class="kpi-hint">${pesoDelta}</div></div>
        <div class="kpi"><div class="kpi-lbl">Última dose</div><div class="kpi-val" style="font-size:14px;padding-top:4px">${ultDose}</div><div class="kpi-hint">${escapeHtml(p.medicamento || '')}</div></div>
        <div class="kpi"><div class="kpi-lbl">Calorias (média)</div><div class="kpi-val" style="font-size:14px;padding-top:4px">${kcal}</div><div class="kpi-hint">${kcalHint}</div></div>
        <div class="kpi"><div class="kpi-lbl">Proteína (média)</div><div class="kpi-val" style="font-size:14px;padding-top:4px">${prot}</div><div class="kpi-hint">${protHint}</div></div>
      </div>

      <hr class="hr">
      <div class="section-title" style="margin-top:0">Proteção Muscular</div>
      <div class="alert ${clsEst}" style="margin-bottom:0">
        <strong>${lblEst}</strong>${msgEst}
      </div>

      ${renderJanelas(p.janelas)}
    </div>

    <div class="footer-note" style="margin-top:16px">
      Dados resumidos. Para registros completos (refeições por dia, sintomas, etc), peça acesso direto ao paciente.
    </div>
  `;
}

// ─── Render ─────────────────────────────────────────────────────────

function render() {
  const c = $('content');
  switch (state.view) {
    case 'loading': c.innerHTML = `<div class="empty"><div class="loader"></div><div style="margin-top:8px">Carregando…</div></div>`; break;
    case 'login': c.innerHTML = viewLogin(); break;
    case 'register': c.innerHTML = viewRegister(); break;
    case 'pro-panel':
      c.innerHTML = viewProPanel();
      // v3.10.32 hardening Fable: listeners pra patient-row (em vez de onclick inline)
      c.querySelectorAll('.patient-row[data-link-id]').forEach(row => {
        row.addEventListener('click', () => abrirPaciente(row.getAttribute('data-link-id')));
      });
      // v1.7.0 (Fase 2): carrega alertas ativos em paralelo — atras da flag T66
      if (FASE2_ALERTAS_ATIVA) {
        setTimeout(() => { try { carregarAlertasAtivos(); } catch (e) { console.warn('[alertas]', e); } }, 60);
      }
      break;
    case 'patient': c.innerHTML = viewPatient(); break;
  }
}

async function enviarMagicLink() {
  const email = $('loginEmail').value.trim();
  const msg = $('loginMsg');
  if (!email || !email.includes('@')) {
    msg.innerHTML = `<div class="alert alert-err" style="margin-top:10px">Informe um email válido.</div>`;
    return;
  }
  msg.innerHTML = `<div class="alert alert-info" style="margin-top:10px"><div class="loader"></div> Enviando…</div>`;
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + '/pro.html' },
  });
  if (error) {
    msg.innerHTML = `<div class="alert alert-err" style="margin-top:10px">Erro: ${escapeHtml(error.message)}</div>`;
    return;
  }
  msg.innerHTML = `<div class="alert alert-ok" style="margin-top:10px"><strong>Link enviado!</strong> Confira seu email e clique no link pra entrar.</div>`;
}

async function cadastrarPro() {
  const nome = $('regNome').value.trim();
  const tipo = $('regTipo').value;
  const registro = $('regRegistro').value.trim();
  const titulo_exibido = $('regTitulo').value.trim();
  const aceiteTermo = ($('regAceiteTermo') || {}).checked;
  const msg = $('regMsg');
  if (!nome || !tipo) {
    msg.innerHTML = `<div class="alert alert-err" style="margin-top:10px">Nome e categoria são obrigatórios.</div>`;
    return;
  }
  // v1.6.0 (Fable T50): aceite obrigatorio do termo pro
  if (!aceiteTermo) {
    msg.innerHTML = `<div class="alert alert-err" style="margin-top:10px">É preciso aceitar o termo pra continuar.</div>`;
    return;
  }
  msg.innerHTML = `<div class="alert alert-info" style="margin-top:10px"><div class="loader"></div> Cadastrando…</div>`;
  try {
    const r = await apiCall('/api/pro-register', {
      method: 'POST',
      body: JSON.stringify({ nome, tipo, registro, titulo_exibido, termo_pro_version: 'v1-2026-06' }),
    });
    state.pro = r.pro;
    await carregarPacientes();
    setView('pro-panel');
  } catch (e) {
    msg.innerHTML = `<div class="alert alert-err" style="margin-top:10px">Erro: ${escapeHtml(e.message)}</div>`;
  }
}

async function carregarPacientes() {
  try {
    const r = await apiCall('/api/pro-patients');
    state.patients = r.pacientes || [];
  } catch (e) {
    state.patients = [];
  }
}

function abrirUploadFoto() {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.setAttribute('data-modal', 'upload');
  ov.innerHTML = `
    <div style="background:linear-gradient(158deg,#041b0d 0%,#0a3a20 52%,#052413 100%);border:1px solid rgba(187,247,208,.22);border-radius:16px;padding:22px 18px;max-width:420px;width:100%">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="font-family:Georgia,serif;font-size:18px;font-weight:500;color:#fff">📷 Enviar imagem</div>
        <button onclick="this.closest('[data-modal]').remove()" style="background:none;border:none;color:rgba(255,255,255,.5);font-size:22px;cursor:pointer">×</button>
      </div>
      <div style="font-size:12.5px;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:14px">JPG, PNG ou WebP, máximo 2MB. A imagem aparece pro paciente no Painel dele.</div>
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:11px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Tipo</label>
        <select id="upKind" style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.18);background:#fff;color:#041b0d;font-size:14px">
          <option value="foto">Foto pessoal</option>
          <option value="logo">Logo da clínica/marca</option>
        </select>
      </div>
      <input id="upFile" type="file" accept="image/jpeg,image/png,image/webp" style="width:100%;font-size:12.5px;color:rgba(255,255,255,.7);margin-bottom:14px">
      <button onclick="confirmarUploadFoto()" class="btn btn-primary">Enviar</button>
      <div id="upMsg" style="margin-top:10px"></div>
    </div>
  `;
  document.body.appendChild(ov);
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
}

async function confirmarUploadFoto() {
  const kind = $('upKind').value;
  const file = $('upFile').files[0];
  const msg = $('upMsg');
  if (!file) {
    msg.innerHTML = `<div class="alert alert-err">Selecione uma imagem.</div>`;
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    msg.innerHTML = `<div class="alert alert-err">Imagem maior que 2MB. Reduza antes.</div>`;
    return;
  }
  msg.innerHTML = `<div class="alert alert-info"><div class="loader"></div> Enviando…</div>`;
  try {
    const data_base64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',').pop());
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    const r = await apiCall('/api/pro-assets', {
      method: 'POST',
      body: JSON.stringify({ kind, data_base64, content_type: file.type }),
    });
    msg.innerHTML = `<div class="alert alert-ok">✓ Imagem enviada</div>`;
    // Atualiza state.pro
    state.pro[kind + '_url'] = r.url;
    setTimeout(() => {
      document.querySelector('[data-modal="upload"]').remove();
      render();
    }, 800);
  } catch (e) {
    const err = e.data && e.data.error === 'arquivo_grande' ? 'Imagem grande demais (max 2MB).'
              : e.data && e.data.error === 'tipo_nao_suportado' ? 'Tipo não suportado. Use JPG, PNG ou WebP.'
              : 'Erro: ' + e.message;
    msg.innerHTML = `<div class="alert alert-err">${escapeHtml(err)}</div>`;
  }
}

async function logout() {
  await sb.auth.signOut();
  state.user = null;
  state.pro = null;
  state.patients = [];
  setView('login');
}

// ─── Bootstrap ──────────────────────────────────────────────────────

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    setView('login');
    return;
  }
  state.user = session.user;
  // Detecta se já é profissional cadastrado
  try {
    const r = await apiCall('/api/pro-me');
    state.pro = r.pro;
    await carregarPacientes();
    setView('pro-panel');
  } catch (e) {
    if (e.status === 403 && e.data && e.data.error === 'not_a_professional') {
      setView('register');
    } else {
      // Sessão pode ter expirado
      await sb.auth.signOut();
      setView('login');
    }
  }
}

// Reage a callbacks de magic link
sb.auth.onAuthStateChange((evt, sess) => {
  if (evt === 'SIGNED_IN' && sess) {
    state.user = sess.user;
    boot();
  }
});

boot();
