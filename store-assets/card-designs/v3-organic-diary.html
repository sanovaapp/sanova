<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sanova · Card v3 — fundo verde Sanova oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* v3.10.48: paleta VERDE SANOVA — fundo escuro do app (Bruno cravou).
       Gradient do pro.html / index.html paciente. */
    --green-bg-1:#041b0d; --green-bg-2:#0a3a20; --green-bg-3:#052413;
    --green-leaf:#22c55e; --green-outline:#0F5C2F;
    --accent:#86efac; --accent-2:#bbf7d0; --accent-dim:rgba(134,239,172,.18);
    --cream-1:#f5f0e3; --cream-2:#ebe5d4;
    --gold:#c8a76a;
    --ink:#f5f0e3; --ink-soft:rgba(245,240,227,.72); --ink-faint:rgba(245,240,227,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#1a1a1a;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
  }
  .frame{
    width:1080px;height:1920px;
    transform-origin:top left;
    transform:scale(.31);
    margin-bottom:-1325px;margin-right:-745px;
    position:relative;overflow:hidden;
    /* v3.10.49 (Bruno): "mesmo verde do v2" — gradient simples 180deg
       de #0a3a20 (verde meio, topo) a #041b0d (deep, base). Sem radiais
       decorativos. Igual o v2 Clinical Modernist usa. */
    background:linear-gradient(180deg,var(--green-bg-2) 0%,var(--green-bg-1) 100%);
    color:var(--ink);
    padding:90px 80px;
    display:flex;flex-direction:column;
  }

  /* folha decorativa grande */
  .deco-leaf{
    position:absolute;
    top:-100px;right:-120px;
    width:480px;opacity:.08;
    transform:rotate(28deg);
  }

  /* top brand */
  .brand{
    display:flex;align-items:center;gap:18px;
    margin-bottom:32px;
  }
  .brand-leaf{width:46px;height:46px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
  .brand-name{
    font-family:'Fraunces',serif;
    font-size:32px;font-weight:500;font-style:italic;
    color:var(--accent-2);
    letter-spacing:-.01em;
  }
  .date{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:16px;font-weight:500;
    color:var(--ink-faint);
    text-transform:uppercase;letter-spacing:.20em;
    margin-bottom:90px;
  }

  /* hero — frase manuscrita-style */
  .hero{margin-bottom:60px;position:relative;z-index:2}
  .hero-eyebrow{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:24px;font-weight:600;
    color:var(--gold);
    text-transform:uppercase;letter-spacing:.30em;
    margin-bottom:24px;
  }
  .hero-line{
    font-family:'DM Serif Display',serif;
    font-size:120px;line-height:1;
    color:var(--cream-1);
    letter-spacing:-.03em;
  }
  .hero-line em{
    font-family:'Fraunces',serif;
    font-style:italic;font-weight:300;
    color:var(--accent);
  }

  /* big number */
  .big{
    margin:50px 0 70px;
    display:flex;align-items:baseline;gap:28px;
    padding-left:28px;
    border-left:6px solid var(--gold);
  }
  .big-num{
    font-family:'DM Serif Display',serif;
    font-size:200px;line-height:.9;
    color:var(--accent);
    letter-spacing:-.05em;
  }
  .big-unit{
    font-family:'Fraunces',serif;
    font-size:44px;font-weight:300;font-style:italic;
    color:var(--ink-soft);
  }

  /* gráfico */
  .chart{margin-bottom:70px}
  .chart-lbl{
    font-family:'Fraunces',serif;
    font-size:26px;font-weight:400;font-style:italic;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .chart-svg{width:100%;height:150px}

  /* stats — em linha minimalista */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:2px solid rgba(134,239,172,.32);
    border-bottom:2px solid rgba(134,239,172,.32);
    padding:34px 0;
    margin-bottom:55px;
  }
  .stat{text-align:center;position:relative}
  .stat + .stat::before{
    content:'';
    position:absolute;left:0;top:10%;height:80%;
    width:1px;background:rgba(134,239,172,.22);
  }
  .stat-icon{font-size:38px;margin-bottom:12px}
  .stat-num{
    font-family:'DM Serif Display',serif;
    font-size:58px;line-height:1;
    color:var(--cream-1);
    letter-spacing:-.02em;
    margin-bottom:6px;
  }
  .stat-lbl{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:17px;font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.10em;
  }

  /* mensagem cursiva (autoria do paciente) */
  .message{
    font-family:'Fraunces',serif;
    font-style:italic;font-weight:300;
    font-size:48px;line-height:1.32;
    color:var(--cream-1);
    margin-bottom:auto;
    position:relative;
    padding-top:54px;
  }
  .message::before{
    content:'“';
    position:absolute;top:-30px;left:0;
    font-family:'DM Serif Display',serif;
    font-size:130px;line-height:.6;
    color:var(--gold);
  }

  /* footer — slogan + URL como CTA */
  .footer{
    margin-top:50px;
    padding-top:30px;
    border-top:1px solid rgba(134,239,172,.20);
  }
  .footer-cta{
    text-align:center;
    margin-bottom:24px;
  }
  .footer-slogan{
    font-family:'Fraunces',serif;
    font-size:48px;font-weight:300;font-style:italic;
    color:var(--cream-1);
    letter-spacing:-.01em;
    margin-bottom:14px;
  }
  .footer-slogan strong{
    font-weight:600;
    color:var(--accent);
  }
  .footer-url{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:34px;font-weight:700;
    letter-spacing:.06em;
    color:var(--green-bg-1);
    background:var(--accent);
    padding:14px 32px;
    border-radius:50px;
    display:inline-block;
    box-shadow:0 4px 16px rgba(134,239,172,.18);
  }
  .footer-meta{
    display:flex;justify-content:space-between;align-items:center;
    padding-top:18px;
    border-top:1px dashed rgba(134,239,172,.18);
  }
  .footer-brand{
    font-family:'Fraunces',serif;
    font-size:24px;font-weight:500;font-style:italic;
    color:var(--accent-2);
  }
  .footer-mol{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14px;font-weight:500;
    color:var(--ink-faint);
    letter-spacing:.06em;
  }
</style>
</head>
<body>
<div class="frame">
  <svg class="deco-leaf" viewBox="0 0 100 140">
    <path d="M50 8 Q12 42 16 92 Q22 132 50 138 Q78 132 84 92 Q88 42 50 8 Z" fill="#86efac"/>
    <path d="M50 8 L50 138 M50 50 L72 60 M50 72 L78 84 M50 92 L74 102 M50 50 L28 60 M50 72 L22 84 M50 92 L26 102" stroke="#0F5C2F" stroke-width="1.2" fill="none" opacity=".6"/>
  </svg>

  <div class="brand">
    <svg class="brand-leaf" viewBox="0 0 100 140">
      <path d="M50 8 Q12 42 16 92 Q22 132 50 138 Q78 132 84 92 Q88 42 50 8 Z" fill="#22c55e"/>
      <path d="M50 8 L50 138 M50 50 L68 60 M50 70 L72 82 M50 90 L70 100 M50 50 L32 60 M50 70 L28 82 M50 90 L30 100" stroke="#0F5C2F" stroke-width="1.5" fill="none" opacity=".7"/>
    </svg>
    <div class="brand-name">Sanova</div>
  </div>

  <div class="date">Semana 26 · 2026</div>

  <div class="hero">
    <div class="hero-eyebrow">Sua semana</div>
    <div class="hero-line">Continua<br><em>nessa rotina.</em></div>
  </div>

  <div class="big">
    <div class="big-num">−0,8</div>
    <div class="big-unit">kg esta semana</div>
  </div>

  <div class="chart">
    <div class="chart-lbl">— peso 7 dias</div>
    <svg class="chart-svg" viewBox="0 0 900 150" preserveAspectRatio="none">
      <defs>
        <linearGradient id="ogGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#86efac" stop-opacity=".42"/>
          <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 25 Q150 35 300 50 Q450 60 600 80 Q750 100 900 120 L900 150 L0 150 Z" fill="url(#ogGrad)"/>
      <path d="M0 25 Q150 35 300 50 Q450 60 600 80 Q750 100 900 120" stroke="#86efac" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="900" cy="120" r="10" fill="#bbf7d0" stroke="#0a3a20" stroke-width="3"/>
    </svg>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-icon">🥩</div>
      <div class="stat-num">6/7</div>
      <div class="stat-lbl">proteína</div>
    </div>
    <div class="stat">
      <div class="stat-icon">💧</div>
      <div class="stat-num">92%</div>
      <div class="stat-lbl">hidratação</div>
    </div>
    <div class="stat">
      <div class="stat-icon">💪</div>
      <div class="stat-num">4</div>
      <div class="stat-lbl">treinos</div>
    </div>
  </div>

  <div class="message">
    Proteína em dia.<br>
    Energia equilibrada.<br>
    Massa magra preservada.
  </div>

  <div class="footer">
    <div class="footer-cta">
      <div class="footer-slogan">Emagreça <strong>sem murchar.</strong></div>
      <div class="footer-url">sanova.app.br</div>
    </div>
    <div class="footer-meta">
      <div class="footer-brand">🌿 Sanova</div>
      <div class="footer-mol">Tratamento: Tirzepatida</div>
    </div>
  </div>
</div>
</body>
</html>
