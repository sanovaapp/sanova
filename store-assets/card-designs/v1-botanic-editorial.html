<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sanova · Card Direção 1 — Botanic Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#041b0d; --bg-2:#0a3a20; --bg-3:#052413;
    --green-leaf:#86efac; --green-cream:#bbf7d0;
    --cream-1:#f5f0e3; --cream-2:#ebe5d4;
    --gold:#c8a76a; --ink-soft:rgba(245,240,227,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#1a1a1a;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    font-family:'Plus Jakarta Sans',-apple-system,sans-serif;
  }
  .frame{
    width:1080px;height:1920px;
    transform-origin:top left;
    transform:scale(.31);
    margin-bottom:-1325px;margin-right:-745px;
    position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse 100% 50% at 50% 0%,rgba(134,239,172,.10),transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%,rgba(200,167,106,.06),transparent 70%),
      linear-gradient(165deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);
    color:var(--cream-1);
    padding:120px 90px;
    display:flex;flex-direction:column;
  }
  /* folhas de fundo */
  .leaf-bg{position:absolute;opacity:.06;pointer-events:none}
  .leaf-bg.lf1{top:-40px;right:-60px;width:380px;transform:rotate(35deg)}
  .leaf-bg.lf2{bottom:-50px;left:-80px;width:420px;transform:rotate(-25deg)}

  .brand{display:flex;align-items:center;gap:20px;margin-bottom:80px}
  .brand-leaf{width:54px;height:54px}
  .brand-name{
    font-family:'Fraunces',serif;
    font-weight:400;font-style:italic;
    font-size:46px;letter-spacing:-.02em;
    color:var(--green-cream);
  }
  .pre-title{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:24px;font-weight:500;
    text-transform:uppercase;letter-spacing:.32em;
    color:rgba(245,240,227,.55);
    margin-bottom:36px;
  }
  .title{
    font-family:'DM Serif Display',serif;
    font-size:108px;line-height:1;
    color:var(--cream-1);
    margin-bottom:120px;
    letter-spacing:-.02em;
  }
  .title em{font-style:italic;color:var(--green-leaf)}

  .hero-num{
    font-family:'DM Serif Display',serif;
    font-size:240px;line-height:.9;
    color:var(--green-leaf);
    margin-bottom:12px;
    letter-spacing:-.04em;
  }
  .hero-lbl{
    font-family:'Fraunces',serif;
    font-size:42px;font-weight:400;font-style:italic;
    color:var(--cream-1);
    margin-bottom:80px;
  }

  /* sparkline */
  .spark{margin-bottom:90px}
  .spark-title{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:18px;font-weight:600;
    text-transform:uppercase;letter-spacing:.24em;
    color:rgba(245,240,227,.55);
    margin-bottom:18px;
  }
  .spark-svg{width:100%;height:160px}

  .stats{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;
    padding:50px 0;
    border-top:1px solid rgba(245,240,227,.12);
    border-bottom:1px solid rgba(245,240,227,.12);
    margin-bottom:80px;
  }
  .stat{text-align:center}
  .stat-num{
    font-family:'Fraunces',serif;
    font-size:64px;font-weight:500;line-height:1;
    color:var(--green-cream);
    margin-bottom:14px;
  }
  .stat-lbl{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:22px;font-weight:500;
    color:var(--ink-soft);
  }

  .message{
    font-family:'Fraunces',serif;
    font-size:46px;line-height:1.35;
    font-weight:300;
    color:var(--cream-1);
    margin-bottom:auto;
    padding-right:40px;
  }
  .message::before{
    content:'';display:block;
    width:54px;height:2px;
    background:var(--gold);
    margin-bottom:36px;
  }

  .footer{
    margin-top:80px;
    display:flex;align-items:center;justify-content:space-between;
    padding-top:40px;
    border-top:1px solid rgba(245,240,227,.10);
  }
  .footer-brand{
    font-family:'Fraunces',serif;
    font-size:36px;font-weight:500;font-style:italic;
    color:var(--green-cream);
  }
  .footer-url{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:22px;font-weight:500;
    letter-spacing:.10em;
    color:rgba(245,240,227,.55);
  }
  .footer-mol{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:18px;font-weight:400;
    color:rgba(245,240,227,.42);
    margin-top:14px;
  }
</style>
</head>
<body>
<div class="frame">
  <!-- folhas de fundo -->
  <svg class="leaf-bg lf1" viewBox="0 0 100 140"><path d="M50 5 Q15 40 18 90 Q25 130 50 135 Q75 130 82 90 Q85 40 50 5 Z M50 5 L50 135" fill="none" stroke="#86efac" stroke-width="1.5"/></svg>
  <svg class="leaf-bg lf2" viewBox="0 0 100 140"><path d="M50 5 Q15 40 18 90 Q25 130 50 135 Q75 130 82 90 Q85 40 50 5 Z M50 5 L50 135" fill="none" stroke="#c8a76a" stroke-width="1.5"/></svg>

  <div class="brand">
    <svg class="brand-leaf" viewBox="0 0 100 140">
      <path d="M50 8 Q12 42 16 92 Q22 132 50 138 Q78 132 84 92 Q88 42 50 8 Z" fill="#86efac"/>
      <path d="M50 8 L50 138 M50 50 L68 60 M50 70 L72 82 M50 90 L70 100 M50 50 L32 60 M50 70 L28 82 M50 90 L30 100" stroke="rgba(4,27,13,.55)" stroke-width="1.5" fill="none"/>
    </svg>
    <div class="brand-name">Sanova</div>
  </div>

  <div class="pre-title">Sua semana</div>
  <div class="title">Proteção <em>em dia.</em></div>

  <div class="hero-num">−0,8 kg</div>
  <div class="hero-lbl">esta semana</div>

  <div class="spark">
    <div class="spark-title">Peso · últimos 7 dias</div>
    <svg class="spark-svg" viewBox="0 0 900 160" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#86efac" stop-opacity=".42"/>
          <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 30 L150 38 L300 58 L450 70 L600 88 L750 110 L900 130 L900 160 L0 160 Z" fill="url(#sparkGrad)"/>
      <path d="M0 30 L150 38 L300 58 L450 70 L600 88 L750 110 L900 130" stroke="#86efac" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="900" cy="130" r="8" fill="#bbf7d0"/>
    </svg>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num">6/7</div>
      <div class="stat-lbl">dias proteína</div>
    </div>
    <div class="stat">
      <div class="stat-num">92%</div>
      <div class="stat-lbl">hidratação</div>
    </div>
    <div class="stat">
      <div class="stat-num">4</div>
      <div class="stat-lbl">treinos</div>
    </div>
  </div>

  <div class="message">
    Proteína em dia.<br>
    Energia em dia.<br>
    Músculo protegido<br>
    nessa semana.
  </div>

  <div class="footer">
    <div>
      <div class="footer-brand">Sanova</div>
      <div class="footer-mol">Tratamento: Tirzepatida</div>
    </div>
    <div class="footer-url">sanova.app.br</div>
  </div>
</div>
</body>
</html>
